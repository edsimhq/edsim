tch":false}}},{"id":"3-s31","text":"In conclusion, Prohibition has been just one issue debated in the United States in our history.","tags":{"task_development":{"match":false,"note":"Conclusion framing; does not develop a new task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Restates the framing of the essay."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"conclusion","note":"Opens the conclusion."},"inaccuracy":{"match":false}}},{"id":"3-s32","text":"Many efforts were made to address the issue, and only some were successful.","tags":{"task_development":{"match":false,"note":"Conclusion framing; restates the intro's success/failure point."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Restates an earlier general claim."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"conclusion","note":"Conclusion sentence echoing the introduction."},"inaccuracy":{"match":false}}},{"id":"3-s33","text":"The issue was a big part of our history as a society, and it will never be forgotten because people are still debating the medical and moral issues surrounding alcohol.","tags":{"task_development":{"match":false,"note":"Conclusion reflection rather than development of a task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A forward-looking reflection; mildly evaluative but the rater did not list it among the essay's analytical statements."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"General reflection rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"conclusion","note":"This is the sentence that lifts the conclusion 'beyond a restatement of the theme' — it connects Prohibition to the ongoing present-day debate over alcohol. The rater noted it would have benefited from more explanation."},"inaccuracy":{"match":false}}}]},{"id":"paper_c","letter":"F","score":1,"paragraphs":[12],"sentences":[{"id":"c-s01","text":"The Historical context behind prohibition is...back in the Early 1800's, Alcohol had become majority popular in England especially after the 1812 war.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Attempts the historical-circumstances aspect — the rise of drinking after the War of 1812."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States background without analysis."},"document_use":{"match":true,"document":"doc1","note":"Loosely uses Document 1 (the War of 1812 and rising alcohol use) — but garbles it (see Inaccuracies). Check Doc 1 to verify."},"outside_information":{"match":false,"note":"Based on a document, not outside knowledge."},"supporting_details":{"match":false,"note":"Vague and partly incorrect rather than a clean supporting detail."},"organization":{"match":true,"category":"introduction","note":"Opening sentence. The paper is a single undeveloped paragraph with no real introduction or conclusion."},"inaccuracy":{"match":true,"note":"Inaccuracy — Document 1 describes a rum trade in NEW ENGLAND (in the United States) after the War of 1812, not in England. The claim that alcohol was popular 'in England' and then 'carried over to America' reverses and misreads the document."}}},{"id":"c-s02","text":"Naturally, this love for alcohol would carry over to America.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Continues the (flawed) historical background."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A general claim, not analysis."},"document_use":{"match":false,"note":"Not from a document."},"outside_information":{"match":false,"note":"A general assertion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No specific fact."},"organization":{"match":false,"category":"body","note":"Continuation of the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s03","text":"However, this alcohol was created drunken fathers and create tears in families and domestic life.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Notes a social consequence of drinking — the harm to families."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States a consequence without analysis."},"document_use":{"match":false,"note":"Not from a document."},"outside_information":{"match":false,"note":"Vague background; not a clear, developed outside fact (this paper presents little or no outside information)."},"supporting_details":{"match":false,"note":"General and vaguely worded rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Continuation of the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s04","text":"So people wanted to change this and, after 25-years, the prohibition act had been passed by an almost unanimous vote by the states.","tags":{"task_development":{"match":true,"category":"efforts","note":"Touches the efforts aspect — the passage of Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the outcome without analysis."},"document_use":{"match":true,"document":"doc2","note":"Loosely uses Document 2 (the Anti-Saloon League's '25 years of effort' and near-unanimous ratification). Check Doc 2 to verify."},"outside_information":{"match":false,"note":"Based on a document."},"supporting_details":{"match":true,"note":"A specific detail — passage after roughly 25 years by an almost unanimous vote of the states."},"organization":{"match":false,"category":"body","note":"Continuation of the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s05","text":"Laws had been passed that make the sale or consumption of alcohol illegal.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — what Prohibition outlawed."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the law without analysis."},"document_use":{"match":false,"note":"General statement, not tied to a specific document."},"outside_information":{"match":false,"note":"General rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"General rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Continuation of the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s06","text":"For a while, this law would be in power.","tags":{"task_development":{"match":false,"note":"A filler transition; develops no task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A vague transition."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":false,"category":"body","note":"Filler transition in the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s07","text":"However, soon the cracks of prohibition would begin to show.","tags":{"task_development":{"match":false,"note":"A transition into the repeal discussion; develops no task aspect on its own."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A vague transition."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":false,"category":"body","note":"Transition in the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s08","text":"Mail-in surveys conducted by the Literary digest showed that people were more in favor of repealing the prohibition act.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — public opinion turning toward repeal."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports the survey without analysis."},"document_use":{"match":true,"document":"doc3","note":"Uses Document 3 (the Literary Digest mail-in survey favoring repeal). Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":true,"note":"Names the Literary Digest survey as evidence of support for repeal."},"organization":{"match":false,"category":"body","note":"Continuation of the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s09","text":"Groups like WONPR had formed to fight to repeal prohibition act.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — the WONPR's repeal campaign."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the group's purpose without analysis."},"document_use":{"match":true,"document":"doc4","note":"Uses Document 4 (the WONPR formed to repeal Prohibition). Note: this paper gets the WONPR's goal correct. Check Doc 4 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 4."},"supporting_details":{"match":false,"note":"A brief, undeveloped mention rather than a specific detail."},"organization":{"match":false,"category":"body","note":"Continuation of the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s10","text":"And despite having made alcohol illegal, people had still been drinking and selling it (illegally) regardless.","tags":{"task_development":{"match":true,"category":"impact","note":"Touches the impact aspect — Prohibition was widely ignored."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the outcome without analysis."},"document_use":{"match":false,"note":"General knowledge, not tied to a specific document."},"outside_information":{"match":false,"note":"A vague general claim rather than a developed outside fact."},"supporting_details":{"match":false,"note":"General rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Continuation of the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s11","text":"Soon, it was decided that the prohibition act was a complete failure, and was repealed.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — Prohibition judged a failure and repealed."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the outcome without analysis."},"document_use":{"match":true,"document":"doc5","note":"Vaguely reflects Document 5's verdict that Prohibition failed, though without citation. Check Doc 5 to verify."},"outside_information":{"match":false,"note":"General rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A general statement of the outcome rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Continuation of the single paragraph."},"inaccuracy":{"match":false}}},{"id":"c-s12","text":"However, when repealed, Roosevelt still kept saloons and bars closed","tags":{"task_development":{"match":true,"category":"impact","note":"Ends on a specific impact — repeal did not bring back the saloon."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the fact without analysis."},"document_use":{"match":true,"document":"doc6","note":"Uses Document 6 (Roosevelt supported repeal but asked the nation to bar the saloon). Check Doc 6 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 6."},"supporting_details":{"match":true,"note":"A specific detail — Roosevelt kept saloons and bars closed after repeal."},"organization":{"match":false,"category":"body","note":"Final sentence. The paper ends abruptly with no real conclusion."},"inaccuracy":{"match":false}}}]},{"id":"level_4","letter":"G","score":4,"paragraphs":[5,10,12,6],"sentences":[{"id":"4-s01","text":"Of all the debates throughout United States history, civic and constitutional issues have made the largest impact on the country.","tags":{"task_development":{"match":false,"note":"Broad opening generalization; does not yet develop a task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive framing statement."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"Opening sentence of the introduction."},"inaccuracy":{"match":false}}},{"id":"4-s02","text":"These debates have often led to continuous efforts by individuals and groups to address issues that need to be solved.","tags":{"task_development":{"match":false,"note":"General framing echoing the prompt."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive framing."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"Introduction sentence."},"inaccuracy":{"match":false}}},{"id":"4-s03","text":"One of these issues is Prohibition, the banned sale and manufacture of alcohol in the early 20th century.","tags":{"task_development":{"match":false,"note":"Names and defines the topic but does not yet develop a task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Defines the topic without analysis."},"document_use":{"match":false,"note":"General definition, not from a document."},"outside_information":{"match":false,"note":"Common-knowledge definition rather than a discrete outside fact."},"supporting_details":{"match":true,"note":"The rater credited the precise definition (Prohibition banned the sale and manufacture of alcohol in the early 20th century) as a supporting detail."},"organization":{"match":true,"category":"introduction","note":"Introduction sentence naming the topic."},"inaccuracy":{"match":false}}},{"id":"4-s04","text":"While prohibition had been addressed in many different ways, the impact of those efforts changed the mindset of American Society during the 1900s and has even influenced the US today.","tags":{"task_development":{"match":false,"note":"Thesis preview of the impact aspect; the impact itself is developed later in the essay."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this thesis (Prohibition's impact changed American society and still influences the US today) as analytical."},"document_use":{"match":false,"note":"The student's own thesis, not from a document."},"outside_information":{"match":false,"note":"A thesis claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A thesis statement rather than a concrete fact."},"organization":{"match":true,"category":"introduction","note":"Thesis sentence — part of an introduction that goes beyond a restatement of the theme."},"inaccuracy":{"match":false}}},{"id":"4-s05","text":"Prohibition, a result of concerns about tremendous liquor production and consumption in the 19th century, gave a voice to minorities and other special interest groups across the country, and its impact was felt in almost every home.","tags":{"task_development":{"match":false,"note":"Thesis preview spanning all three aspects; specifics are developed in the body."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this (Prohibition gave a voice to minorities and special interest groups) as analytical."},"document_use":{"match":false,"note":"The student's own thesis framing."},"outside_information":{"match":false,"note":"A broad thesis claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A thesis statement rather than a concrete fact."},"organization":{"match":true,"category":"introduction","note":"Closing thesis sentence of the introduction."},"inaccuracy":{"match":false}}},{"id":"4-s06","text":"The right to drink alcohol was something most Americans took for granted.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Opens the historical-circumstances aspect."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this framing (drinking was a right most Americans took for granted) as analytical."},"document_use":{"match":false,"note":"The student's own framing."},"outside_information":{"match":false,"note":"Framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s07","text":"Since the settlement of Jamestown, people in America drank including our Founding Fathers.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the long history of drinking in America."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States a historical fact without interpretation."},"document_use":{"match":false,"note":"Doc 1 notes the Founding Fathers drank, but the student frames this as general knowledge (Jamestown); the rater credited it as a supporting detail."},"outside_information":{"match":false,"note":"Counted by the rater as a supporting detail."},"supporting_details":{"match":true,"note":"Specific historical reference (Jamestown, Founding Fathers) credited by the rater."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s08","text":"Specifically after the 1812 war, New England states led the charge for \"West Indian Rum, which was consumed extensively\" (Doc 1).","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances using Doc 1."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes the document without interpretation."},"document_use":{"match":true,"document":"doc1","note":"Quotation from Document 1 (West Indian rum consumed extensively after the War of 1812). Check Doc 1 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 1."},"supporting_details":{"match":true,"note":"Specific document-based detail (New England, West Indian rum) credited by the rater."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s09","text":"The consumption and sale of these products together led to what some considered a nation-wide drinking problem and to a temperance movement with a strong message.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the rise of the temperance movement."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes cause and effect at a general level rather than analyzing it."},"document_use":{"match":false,"note":"General statement, not tied to a specific document."},"outside_information":{"match":false,"note":"General framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"General rather than a specific named fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s10","text":"It can be inferred from speeches and writings of groups such as the Women's Christian Temperance Union that it was most likely difficult to find a man who wasn't spending money getting drunk, no matter the time of day.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the WCTU's portrayal of widespread drunkenness."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Frames an inference, but the rater listed it among supporting details rather than as analysis."},"document_use":{"match":false,"note":"The WCTU appears in Doc 4, but this is the student's inference rather than document text."},"outside_information":{"match":false,"note":"Counted by the rater as a supporting detail."},"supporting_details":{"match":true,"note":"The rater credited the WCTU's speeches and writings as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s11","text":"Alcohol was easy to access, and people took advantage of that, and drank too much endangering their health and jobs which often led wives and children into poverty.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the social toll of easy access to alcohol."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes consequences rather than evaluating them."},"document_use":{"match":false,"note":"Not in any document — the student's own knowledge."},"outside_information":{"match":true,"note":"The rater credited this as outside information: easy access led to overdrinking that endangered health and jobs and pushed families into poverty."},"supporting_details":{"match":false,"note":"Counted as outside information rather than a specific supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s12","text":"Thus, it became a concern of many women, employers, and religious leaders to see alcohol as a problem that needed fixing.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — who came to see alcohol as a problem."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes the coalition of concern without analysis."},"document_use":{"match":false,"note":"Not from a document — the student's own knowledge."},"outside_information":{"match":true,"note":"The rater credited this as outside information: alcohol became a concern of women, employers, and religious leaders."},"supporting_details":{"match":false,"note":"Counted as outside information rather than a specific supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s13","text":"The longer and more effectively the Anti-Saloon League and other anti-liquor groups expressed the negative aspects of alcohol the more demands there were that politicians do something about it.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — mounting political pressure for Prohibition."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this cause-and-effect (the more effectively groups argued, the more political demands grew) as analytical."},"document_use":{"match":false,"note":"The student's own analysis."},"outside_information":{"match":false,"note":"Analysis rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An analytical claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s14","text":"Because of this, \"the greatest moral victory since the declaration of Independence\" (Doc 2) was born in the form of Prohibition and the 18th Amendment which ended the sale and manufacture of alcohol.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Closes the historical-circumstances aspect — the birth of Prohibition and the 18th Amendment."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes the document to mark the outcome."},"document_use":{"match":true,"document":"doc2","note":"Quotation from Document 2 (Anti-Saloon League): the greatest moral victory since the Declaration of Independence. Check Doc 2 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 2."},"supporting_details":{"match":true,"note":"The rater credited '18th amendment ended sale and manufacture of alcohol' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Concluding sentence of the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s15","text":"However, other groups have stated that Prohibition actually had a negative impact on the country and was undemocratic since only a minority of Americans supported it.","tags":{"task_development":{"match":true,"category":"impact","note":"Introduces the impact aspect — the view that Prohibition was harmful and undemocratic."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this evaluation (Prohibition had a negative impact and was undemocratic since only a minority supported it) as analytical."},"document_use":{"match":false,"note":"The student's own evaluative claim."},"outside_information":{"match":false,"note":"An evaluation rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Pivot sentence at the end of the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s16","text":"When Herbert Hoover was running for President in 1928, he called Prohibition \"noble\" and \"far-reaching in purpose.\"","tags":{"task_development":{"match":true,"category":"efforts","note":"Opens the efforts aspect with Hoover's public support for Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes Hoover without interpretation."},"document_use":{"match":true,"document":"doc3","note":"Draws on Document 3 (Hoover's 1928 'noble... far-reaching in purpose' remark). Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":false,"note":"A quoted opinion setting up the next sentence rather than a concrete fact."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s17","text":"After he was elected he signed a law making every liquor violation a felony.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with a specific governmental action."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States what the law did without analysis."},"document_use":{"match":true,"document":"doc3","note":"From Document 3 — Hoover signed the 'Five and Ten Law' making every liquor violation a felony. Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":true,"note":"Specific governmental action credited by the rater (felony law signed after Hoover's election)."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s18","text":"Although hopeful Prohibition would succeed, it supporters would actually see their efforts go in the opposite direction; Many people actually wanted to get rid of prohibition.","tags":{"task_development":{"match":true,"category":"efforts","note":"Pivots to repeal efforts — develops the efforts aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the shift in sentiment without deeper analysis."},"document_use":{"match":false,"note":"General framing, not from a document."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":false,"note":"General framing rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Transition within the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s19","text":"One of these groups was the WONPR, women who believed that Prohibition had led to a \"surge in underage and unregulated drinking\" and raised a lot of money to get their message out sometimes using the radio. (Doc 4).","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with a second group (WONPR) and its repeal campaign."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports the WONPR's beliefs and activities, quoting Doc 4."},"document_use":{"match":true,"document":"doc4","note":"From Document 4 — WONPR believed Prohibition caused a surge in underage/unregulated drinking and raised money, using radio. Check Doc 4 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 4."},"supporting_details":{"match":true,"note":"Specific document-based details (WONPR's belief, fundraising, radio) credited by the rater."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s20","text":"This surge in drinking could be attributed to the large amounts of underground sales of alcohol.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — explaining the surge in drinking."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Offers a cause but at a general level the rater treated as a supporting detail rather than analysis."},"document_use":{"match":false,"note":"The student's own explanation, not from a document."},"outside_information":{"match":false,"note":"Counted by the rater as a supporting detail."},"supporting_details":{"match":true,"note":"The rater credited 'the surge in drinking could be attributed to large amounts of underground sales of alcohol' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s21","text":"Bootleggers, people who illegally sold alcohol, became more common and many made a fortune off people who wanted liquor.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the rise of bootlegging."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes bootlegging without analysis."},"document_use":{"match":false,"note":"Not in any document."},"outside_information":{"match":false,"note":"Bootlegging is outside the documents, but the rater did not list it among the essay's credited outside information."},"supporting_details":{"match":false,"note":"General elaboration rather than a specific credited fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s22","text":"However, drunkiness wasn't the only issue.","tags":{"task_development":{"match":false,"note":"Transition sentence; does not develop a task aspect on its own."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A transition, not analysis."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":false,"category":"body","note":"Transition within the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s23","text":"Some believed that prohibition revealed the \"limits of moral reform movements\" (Doc 6), as stated by Michael A. Lerner, an author for Harvard University Press.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect with an expert assessment of Prohibition's failure."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes and attributes the source; the interpretation comes in the next sentence."},"document_use":{"match":true,"document":"doc5","note":"The quotation 'limits of moral reform movements' is from Document 5 (Michael A. Lerner, Harvard University Press) — the essay mislabels it as Doc 6 (see Inaccuracies). Check Doc 5 to verify."},"outside_information":{"match":false,"note":"Drawn from a document (Doc 5)."},"supporting_details":{"match":false,"note":"A quoted assessment rather than a concrete fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":true,"note":"Citation error — this quote is from Document 5 (Michael A. Lerner), not Document 6 (the New York Times front page). The content and the author/publisher are correct; only the document number is wrong."}}},{"id":"4-s24","text":"This statement creates the sense that prohibition not only made people violate the laws of the government, but it also led to the government violating the civil rights of the US public.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — Prohibition's effect on law-breaking and civil rights."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this interpretation (Prohibition led both to lawbreaking and to the government violating civil rights) as analytical."},"document_use":{"match":false,"note":"The student's own interpretation of the Doc 5 quote."},"outside_information":{"match":false,"note":"Interpretation rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An interpretive claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s25","text":"Prohibition seemed to create distrust in the government as it was a way to control the behavior of the US public.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — distrust of government."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Borderline interpretation, but the rater did not list it among the essay's analytical statements."},"document_use":{"match":false,"note":"The student's own claim."},"outside_information":{"match":false,"note":"A general claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s26","text":"On a similar note, the public had felt that their freedom was being limited by not being able to consume a specific product.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the public's sense of lost freedom."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this (the public felt their freedom was being limited) as analytical."},"document_use":{"match":false,"note":"The student's own claim."},"outside_information":{"match":false,"note":"An interpretive claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An interpretive claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s27","text":"As the Great Depression worsened disagreements over Prohibition grew and eventually lead to it becoming a campaign issue in 1932 when Franklin Roosevelt ran against Herbert Hoover and supported the repeal of the 18th Amendment.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — Prohibition becoming a 1932 campaign issue."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes the political sequence without analysis."},"document_use":{"match":false,"note":"Not tied to a specific document — the student's own knowledge."},"outside_information":{"match":true,"note":"The rater credited this as outside information: as the Great Depression worsened, Prohibition became a 1932 campaign issue with FDR running against Hoover and supporting repeal."},"supporting_details":{"match":false,"note":"Counted by the rater as outside information."},"organization":{"match":false,"category":"body","note":"Concluding sentence of the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"4-s28","text":"Overall, while it was initially demanded Prohibition would ultimately be a failure.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the overall verdict that Prohibition failed."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this overall judgment (while initially demanded, Prohibition would ultimately be a failure) as analytical."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative conclusion rather than a specific fact."},"organization":{"match":true,"category":"conclusion","note":"Opens the conclusion, which goes beyond a restatement of the theme."},"inaccuracy":{"match":false}}},{"id":"4-s29","text":"It cost millions of dollars to enforce, enforcement was generally a failure, and Americans were tired of it and didn't want it.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the costs and failure of enforcement."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Lists reasons for failure without deeper analysis."},"document_use":{"match":false,"note":"Echoes Doc 5's 'millions of dollars a year' but is woven in generally without citation."},"outside_information":{"match":false,"note":"General summary rather than a discrete credited outside fact."},"supporting_details":{"match":false,"note":"General reasons rather than a specific credited fact."},"organization":{"match":true,"category":"conclusion","note":"Conclusion sentence summarizing why Prohibition failed."},"inaccuracy":{"match":false}}},{"id":"4-s30","text":"Regulating the personal habits of urban America, even with authoritarian tactics was impossible, especially during the 1920s.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — why regulating personal habits proved impossible."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Closely echoes Doc 5's language ('authoritarian tactics,' 'personal habits') rather than the student's own analysis."},"document_use":{"match":false,"note":"Paraphrases Doc 5 ideas but without citation; Doc 5 is already credited via sentence 4-s23."},"outside_information":{"match":false,"note":"Paraphrase rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":true,"category":"conclusion","note":"Conclusion sentence."},"inaccuracy":{"match":false}}},{"id":"4-s31","text":"While it can be argued that the Progressive idea to improve America wasn't bad and that it wasn't executed properly, it generally led the US public to realizing that a right that they had since the founding of the country had been restricted by the government and they resented it.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — Prohibition as a restricted right the public resented."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this balanced evaluation (the Progressive idea wasn't bad but poorly executed; the public realized a long-held right had been restricted and resented it) as analytical."},"document_use":{"match":false,"note":"The student's own evaluation."},"outside_information":{"match":false,"note":"An evaluation rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative claim rather than a specific fact."},"organization":{"match":true,"category":"conclusion","note":"Conclusion sentence offering a thoughtful evaluation beyond the theme."},"inaccuracy":{"match":false}}},{"id":"4-s32","text":"The public's ability to come together and fight against prohibition presented the strength of democracy which led to the successful repeal of Prohibition.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — repeal as a demonstration of democratic strength."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this conclusion (the public coming together showed the strength of democracy, leading to repeal) as analytical."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative conclusion rather than a specific fact."},"organization":{"match":true,"category":"conclusion","note":"Conclusion sentence tying repeal to democratic ideals."},"inaccuracy":{"match":false}}},{"id":"4-s33","text":"Opposition to Prohibition was just one of the many civil rights argued throughout US history, but the nation can be sure to see similar debates transpire in the near future.","tags":{"task_development":{"match":false,"note":"Forward-looking closer rather than development of a task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A closing reflection rather than analysis of Prohibition itself."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"A general reflection rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"conclusion","note":"Final sentence — connects Prohibition to the broader, ongoing history of civic debate, lifting the conclusion beyond a restatement."},"inaccuracy":{"match":false}}}]},{"id":"paper_e","letter":"H","score":2,"paragraphs":[11],"sentences":[{"id":"e-s01","text":"The historical circumstances surrounding the constitutional or civic issue of prohibition in the United States were largely driven by the temperance movement, which sought to reduce or eliminate the consumption of alcoholic beverages.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Opens the historical-circumstances aspect — the temperance movement behind Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the background without analysis."},"document_use":{"match":false,"note":"No document is cited. This idea is in Document 1, but the writer never points to it — a recurring problem in this essay."},"outside_information":{"match":true,"note":"Outside knowledge — the temperance movement is stated from memory, not from a document."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":true,"category":"introduction","note":"Opening sentence. Notice the essay has NO paragraph breaks — it is one long block with no clear topic sentences."},"inaccuracy":{"match":false}}},{"id":"e-s02","text":"This movement gained momentum in the late 19th and early 20th centuries culminating in the passage of the 18th Amendment in 1919 which prohibited the manufacture sale and transportation of alcoholic beverages","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the path to the 18th Amendment."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Narrates events without analysis."},"document_use":{"match":false,"note":"No document cited — these dates are recalled from memory, not drawn from the sources."},"outside_information":{"match":true,"note":"Outside knowledge — the 18th Amendment (1919) and what it banned, stated without using a document."},"supporting_details":{"match":true,"note":"Specific facts — the 18th Amendment, 1919, and what it prohibited."},"organization":{"match":false,"category":"body","note":"Run-on — this sentence has no period and collides with the next one ('...beverages Efforts...'). Weak organization."},"inaccuracy":{"match":false}}},{"id":"e-s03","text":"Efforts by individuals, groups, and governments to address the issue of prohibition were varied and often contentious.","tags":{"task_development":{"match":true,"category":"efforts","note":"Announces the efforts aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A framing statement, not analysis."},"document_use":{"match":false,"note":"No document cited."},"outside_information":{"match":false,"note":"General framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No specific fact."},"organization":{"match":true,"category":"body","note":"This is really a TOPIC SENTENCE for the efforts section — but the writer buried it: no new paragraph, and it's run together with the previous sentence. A simple topic sentence on its own line would have helped."},"inaccuracy":{"match":false}}},{"id":"e-s04","text":"Supporters of prohibition including religious groups and women's organization believed that alcohol was the root cause of many social problems including domestic violence and poverty.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — who supported Prohibition and why."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes the supporters' beliefs without analysis."},"document_use":{"match":false,"note":"No document cited — religious groups and women's organizations appear in the documents, but the writer does not reference them."},"outside_information":{"match":true,"note":"Outside knowledge — supporters saw alcohol as the root cause of domestic violence and poverty, stated from memory."},"supporting_details":{"match":false,"note":"General rather than a specific named fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence within the run-on block."},"inaccuracy":{"match":false}}},{"id":"e-s05","text":"They lobbied for the passage of the 18th Amendment which was eventually ratified and went into effect in 1920.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — lobbying for the amendment."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports events without analysis."},"document_use":{"match":false,"note":"No document cited."},"outside_information":{"match":true,"note":"Outside knowledge — the amendment was ratified and took effect in 1920, recalled without a document."},"supporting_details":{"match":true,"note":"Specific fact — the 18th Amendment went into effect in 1920."},"organization":{"match":false,"category":"body","note":"Supporting sentence within the run-on block."},"inaccuracy":{"match":false}}},{"id":"e-s06","text":"However, prohibition was met with widespread resistance leading to the rise of organized crime and illegal speakeasies.","tags":{"task_development":{"match":true,"category":"impact","note":"Begins the impact aspect — resistance, organized crime, speakeasies."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States consequences without developing analysis."},"document_use":{"match":false,"note":"No document cited."},"outside_information":{"match":true,"note":"Outside knowledge — organized crime and speakeasies, stated from memory rather than a document."},"supporting_details":{"match":false,"note":"General consequences rather than a specific named fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence within the run-on block."},"inaccuracy":{"match":false}}},{"id":"e-s07","text":"This resistance ultimately led to the repeal of prohibition with the passage of the 21st Amendment in 1933","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — repeal via the 21st Amendment."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the outcome without analysis."},"document_use":{"match":false,"note":"No document cited."},"outside_information":{"match":true,"note":"Outside knowledge — the 21st Amendment (1933) repealed Prohibition, recalled without a document."},"supporting_details":{"match":true,"note":"Specific fact — the 21st Amendment, 1933."},"organization":{"match":false,"category":"body","note":"Another run-on — no period; it collides with the next sentence ('...1933 the impact...'). Weak organization."},"inaccuracy":{"match":false}}},{"id":"e-s08","text":"the impact of prohibition on the United States and American society was profound.","tags":{"task_development":{"match":true,"category":"impact","note":"Frames the impact aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A general framing claim."},"document_use":{"match":false,"note":"No document cited."},"outside_information":{"match":false,"note":"General framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No specific fact."},"organization":{"match":true,"category":"body","note":"This is really the TOPIC SENTENCE for the impact section — but it starts with a lowercase letter and is jammed onto the end of the previous sentence. As a clean, capitalized topic sentence starting a new paragraph, it would organize the essay much better."},"inaccuracy":{"match":false}}},{"id":"e-s09","text":"While it was intended to address social issues and improve public morals it often had the opposite effect.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — Prohibition backfired."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"An analytical point — the policy's intent versus its opposite real effect."},"document_use":{"match":false,"note":"No document cited."},"outside_information":{"match":false,"note":"An evaluative claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An interpretation rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence within the run-on block."},"inaccuracy":{"match":false}}},{"id":"e-s10","text":"The rise of organized crime the loss of tax revenue from the alcohol industry and the widespread disregard for the law all had lasting impacts on American society.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — listing lasting effects."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Lists impacts without deeper analysis."},"document_use":{"match":false,"note":"No document cited."},"outside_information":{"match":true,"note":"Outside knowledge — lost tax revenue and disregard for the law, stated from memory rather than a document."},"supporting_details":{"match":false,"note":"A general list rather than a specific credited fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence within the run-on block."},"inaccuracy":{"match":false}}},{"id":"e-s11","text":"Ultimately the efforts to enforce prohibition were unsuccessful leading to its repeal and the return of legal alcohol sales.","tags":{"task_development":{"match":true,"category":"impact","note":"Closes the impact discussion — enforcement failed and Prohibition was repealed."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"An evaluative conclusion that enforcement ultimately failed."},"document_use":{"match":false,"note":"No document cited."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative conclusion rather than a specific fact."},"organization":{"match":true,"category":"conclusion","note":"A concluding sentence. It does wrap up — but with no paragraph breaks anywhere, the reader never gets clear signposts through the essay."},"inaccuracy":{"match":false}}}]}],"defaultEssayId":"level_3","practices":[{"id":"paper_b","label":"Practice Paper B","score":4,"raw_text":"The consumption of alcohol has been seen as a relief for some after a hard day of labor or as part of a family celebration or gathering. American drinking habits in the 1800s with alcohol consumption on the rise, made it more common to think that a change needed to be made. While there have been many debates over Prohibition and efforts to address the issue, there wasn't a national ban until the 20th century.\n\nAlthough alcohol has always been a part of society, the prohibition idea didn't come around until the 19th century. After the war of 1812, there was an increase in alcohol production due to the high demand (Doc 1). Alcohol prices dropped and it became more accessible for all. Unfortunately, this caused an increase in husbands who drank too much. While that may seem unimportant, many women were becoming concerned for their future life styles. Often, the husband would spend the little money made on purchasing alcohol and once he came home he might act violently towards his wife and children. Although this scenario may not occur in all households, many women decided to speak out against alcohol in order to support other women and families. On top of all this, the cult of domesticity was prominent during the 1800s and was a belief that women belong at home in their sphere being caretakers and house wives. It was assumed that women would not get jobs outside the home and the husband would be the protector and provider. Alcohol abuse by their husbands threatened their sphere. This left women at the mercy of their husbands because they needed his income in order to live a life of security. This inspired women to unite together and organize temperance movements which ultimately sparked the prohibition movement and ratification of the 18th Amendment.\n\nWith the success of the prohibition movement came the need for enforcement measures. Many efforts were made to \"crystallize their cause.\" In 1929, Hoover signed the \"Five and Ten Law,\" which made every liquor violation a felony. (Doc 3). Hoover did this in hopes of it further enforcing the 18th Amendment, but unfortunately many of the efforts to improve enforcement failed. Many had become so willing to break the law that there weren't enough police to enforce Prohibition. Some people were willing to join gangs or even purchase bootleg alcohol. Hoover's efforts led to a significant increase of the jail population but not public support for Prohibition which eventually led to the repeal of the amendment. At this point prohibition of alcohol was affecting the worsening economy. However Hoover was not the only person making efforts to address the issues of prohibition. Many women changed from being temperance supporters to opposing Prohibition. In 1929, the Women's Organization for National Prohibition Reform (WONPR) was founded to politically fight against temperance. They believed that prohibition had led to a spike in the amount of underage drinkers. So they were able to raise money despite the Depression and held rallies, radio talks, and even door-to-door recruitment to spread their message (Doc 4). While the WONPR was fighting Prohibitionists, it revealed how controversial this topic was. There was no \"easy\" fix and it would take Franklin Roosevelt to order the 21st Amendment to take effect in 1933 after it was ratified (Doc 6).\n\nThe impacts of prohibition were many. The prohibition era or the dry crusade made many citizens believe that the government was untrustworthy and suffocating (Doc 4 + 5). Eventually Roosevelt supported repeal of prohibition, but with some restraint on saloons and their hours (Doc 6). After that people had other things to worry about so things began settle down and eventually the American people had to compromise. Today, there is a drinking age of 21 and while that's not always followed to the fullest, it does help place boundaries on alcohol. This era will never be deemed as completely successful due to all the backlash it received, the difficulty with enforcement, and the criminal behavior it encouraged. However, there were some successes. Since Prohibition was controversial, it gave people the opportunity to express their ideas and beliefs and the government listened when the majority won the debate with the repeal of prohibition (Doc 6).\n\nAlcohol is still an issue in today's society, but even so it is at a smaller scale. It took a long Depression and World War II to get over the prohibition conflict. While this issue may never fully be resolved it has come a long way since the 19th and 20th centuries.","rater_commentary_summary":"Overall, the response fits the criteria for Level 4. A good understanding of the role of the cult of domesticity in encouraging the support of women for Prohibition is demonstrated. While some important concepts are included in the discussion of impact, additional facts and details would have strengthened the effort."},{"id":"paper_d","label":"Practice Paper D","score":5,"raw_text":"Debates over rights, laws, privileges, etc. have existed for as long as the U.S. itself has. Many of these debates are fueled by the pursuit of morality & equality, such as the womans' rights movement & the abolitionist cause. Notably, the issue of Prohibition persisted throughout much of American history. While many supported the cause, seeing it as a vital opportunity for moral reform, others opposed it, believing the seemingly benevolent movement actually did more harm than good. The affects of both sides of the Prohibition movement are still felt today, even though the movement ultimately failed.\n\nPrior to the emergence of the idea of Prohibition, the sale & consumption of alcohol was at an all time high. Document 1 states that following the War of 1812, \"a large commerce in West Indian rum\" grew in the New England states, and that \"hard drinking was almost the rule for Fathers of the Republic\". This document helps to convey how truly widespread the consumption of alcohol was. However, along with other morally motivated movements, the Prohibition movement emerged in an attempt to combat this, resulting in what some expected to be unanimous state approval for national prohibition.\n\nMany Americans supported the movement, seeking to ban alcohol in the name of moral reform. The reason for this is that drinking often led to disastrous social effects & was generally seen as \"immoral behavior\". Families were destabilized and drunkenness caused men to lose jobs and not be able to support their families. Alcohol was also seen as degrading to women as men sat in saloons disrespecting their wives who were home caring for their children. Carrie Nation's saloon smashing is an example of the frustration many women in the Women's Christian Temperance Union were feeling. Religious convictions were often at the core of Prohibition as can be seen in document 2. It frames the ratification of the Prohibition movement as \"the greatest victory for moral reform in America since the Declaration of Independence\". Audiences throughout the country became convinced that drinking was inherently immoral. This is corroborated by document 3, which displays President Hoover's support for Prohibition, highlighting the \"Five and Ten Law\", which made every liquor violation a felony, along with his support for the general Prohibition movement which he saw as \"a great social and economic experiment, noble in motive and far-reaching in purpose.\" By 1932, Americans were outspoken about their support for repeal of the Amendment; but Hoover continued to support Prohibition during his campaign for reelection. With only one state polling in favor of Prohibition and with people suffering from the Great Depression the mood of the nation was not great.\n\nThe Depression caused even more people to question Prohibition. A large number of Americans opposed the movement, seeing it as a band-aid fix to a larger problem which had unforeseen consequences. The reason for this is that it was largely an attempt to control the lives of Americans, which angered some and caused others to rebel, leading to increases in issues such as underage drinking. For example, document 4 presents a declaration from the WONPR, a group of women dedicated to opposing temperance in the 1920s when women were becoming bolder and more independent. They also had gotten the right to vote in the 19th Amendment. They expressed their primary gripes with the 18th amendment, stating \"the WONPR's opposition to Prohibition, just like the 18th amendment itself, was not only about drinking, but also about the government's role in regulating behavior\".\n\nThe effects of the Prohibition movement are still felt today, in a America where alcohol is legal. The reason for this is that even though Prohibition ultimately failed, the existence of things like alcohol licenses show that attempts to regulate alcohol use remain. Document 6 displays a newspaper showing Roosevelt's announcement about the repeal of Prohibition, which he supported when running for President. However, he also asked the nation to ban the operation of bars, saloons, and taverns in the U.S. Roosevelt's actions reflected much of modern day America's view on alcohol & temperance: it should be legal, but sufficiently regulated.\n\nEven in the present, the legality of drugs/intoxicating items is still being questioned. Notably, marijuana has been a hot button topic. While undeniably a drug which can prove to harm, it also has noticeable medical benefits which should be considered. Going back a couple years, cigarettes were also a topic of discussion. Many believed tobacco wasn't harmful and was possibly even helpful. However, we now know that tobacco is highly harmful to the human body. Most of these discussions either circle back or mirror discussions over alcohol.","rater_commentary_summary":"Overall, the response fits the criteria for Level 5. An analytical discussion of Prohibition is well supported by substantive historical details and effective integration of document quotations. The treatment of impact includes thoughtful conclusions about the continuing influence of the Prohibition debate and its connection to contemporary debates over federal regulation of personal behavior."}],"defaultPracticeId":"paper_b","documents":[{"id":"doc1","title":"Document 1","source":"L. Ames Brown, \"Prohibition,\" The North American Review, November 1915","type":"text","content":"The prohibition movement was an outgrowth of the temperance crusades of the first half of the nineteenth century. Hard drinking was almost the rule among the Fathers of the Republic. The per capita consumption of spirits in the early days was many times what it is now, and beer drinking was almost unknown. After the War of 1812, there grew up in the New England States a large commerce in West Indian rum, which was consumed extensively, especially in Maine, supplementing the consumption of heavy liquors which were manufactured in those States. Maine alone, in 1827, when her population was 360,000, manufactured 1,333,160 gallons of liquor, and it was sold at retail in nearly every store and tavern. Drunkenness in its worst form, involving disastrous social consequences, was widespread. Sufficient evidence of it was to be found in the number of persons in the jails and poorhouses.","image_description":null,"preamble":null,"image_file":null},{"id":"doc2","title":"Document 2","source":"Anti-Saloon League of America, 1919","type":"image_and_text","content":"STATEMENT OF THE NATIONAL LEGISLATIVE COMMITTEE OF THE ANTI-SALOON LEAGUE OF AMERICA\n\nThe ratification of the Prohibition amendment to the constitution is the consummation of more than twenty-five years of effort on the part of the Anti-Saloon League, representing as it has the moral and religious forces of the nation. It is the greatest victory for moral reform in America since the Declaration of Independence.\n\nNot less in importance to that which has already been accomplished is the vitally essential task now before the Prohibition forces of securing from Congress and the states proper enforcement legislation and the crystallizing of public sentiment in the large cities and wet districts for complete enforcement of the law.\n\nWith Prohibition assured for this nation, the American anti-liquor forces need to redouble their efforts for the larger task of world Prohibition of the manufacture and sale of all intoxicating beverages.","image_description":"A poster titled 'National Prohibition Ratification Map' showing a map of the United States with numbers indicating the order in which states ratified the National Prohibition Amendment. The map notes that as of January 31, 1919, only four states had not ratified. Three of these (Pennsylvania, Connecticut, and Rhode Island) were expected to ratify soon. Even New Jersey was expected to ratify and make the result unanimous.","preamble":null,"image_file":"images/doc2_ratification_map.png"},{"id":"doc3","title":"Document 3","source":"Charles Rappleye, Herbert Hoover in the White House, Simon & Schuster, 2016 (adapted)","type":"text","content":"Over his first three years in the White House Hoover never wavered in his support for Prohibition. In 1929 he signed the \"Five and Ten Law\" making every liquor violation a felony, and his Justice Department ramped up federal enforcement. \"We enormously increased the jail population,\" by jailing Prohibition violators Hoover recalled in his memoirs. \"We multiplied the fines, padlocking, and confiscations.\" Yet all this aggressive action he ascribed [attributed] to his duty as a constitutional officer, not to his actual endorsement. On this basic political question, Hoover declined to share his feelings and refused to act on them.\n\nDuring the 1928 campaign Hoover famously saluted Prohibition as \"a great social and economic experiment, noble in motive and far-reaching in purpose.\" But three years later, surely the test had been run.\n\nBy early 1932 little doubt remained as to the mood of the electorate. Respondents to a national mail-in survey conducted by The Literary Digest in February and March endorsed repeal of the Eighteenth Amendment by a four-to-one margin. Residents of Ohio, the birthplace of Prohibition, sent in 112,026 ballots for repeal and just 43,284 for keeping the ban on booze. Kansas was the only state to poll in favor of Prohibition.","image_description":null,"preamble":null,"image_file":null},{"id":"doc4","title":"Document 4","source":"Sarah Seidman, \"The New York Women Who Dismantled Prohibition,\" Museum of the City of New York, December 15, 2015","type":"text","content":"The Women's Organization for National Prohibition Reform (WONPR) was founded in 1929 to show that not all women supported temperance. New York socialite Pauline Sabin led the charge after hearing Ella Boole, the Brooklyn-based leader of the Women's Christian Temperance Union, declare that her support for Prohibition represented \"the women of America.\" On the heels of the successful suffrage campaign that won women the right to vote in 1920, the WONPR, and Sabin in particular, reflected the modern \"new woman\" of the 1920s. Many members of the WONPR had in fact initially supported the 18th amendment. But they had come to believe that Prohibition had led to a surge in unregulated and particularly underage drinking, as well as a growing sense of distrust for the rule of law. The WONPR's opposition to Prohibition, just like the 18th amendment itself, was not only about drinking, but about the government's role in regulating behavior.\n\nThe WONPR did a lot of what we think of now as typical political campaign activities: members attended meetings and gave speeches at rallies, went door-to-door to recruit new supporters, used new technology to spread their message—at the time radio, and lobbied politicians. Wealthy women had founded the organization, and proved able to raise funds even after the Stock Market Crash of 1929 ushered in the Great Depression. From its headquarters in New York City, the organization also gained publicity by organizing events such as a motorcade through New York State.","image_description":null,"preamble":null,"image_file":null},{"id":"doc5","title":"Document 5","source":"Michael A. Lerner, Dry Manhattan: Prohibition in New York City, Harvard University Press, 2007","type":"text","content":"The end of the Prohibition era marked the demise of a moral crusade meant to impose a uniform standard of social behavior in the United States. Unrealistic and unforgiving, Prohibition had allowed a vocal minority to regulate the personal habits of all Americans, especially those who lived and worked in cities like New York. While the desire of the dry crusade to uplift and improve the United States by banning alcohol and the saloon had in some ways been understandable in the Progressive era that spawned the Prohibition movement, the shortcomings of the dry crusade manifested themselves as soon as the dry experiment had begun. Anachronistic [outdated] and unworkable, the Prohibition experiment was ill suited to the diversity and dynamic of the modern United States, which by the 1920s had grown too large and too varied a nation to be governed by an impulse as intrusive as the dry crusade. Despite the force of federal law, the use of authoritarian tactics to enforce it, and the expenditure of millions of dollars a year, in fourteen years Prohibition succeeded neither in changing Americans' behavior nor in eliminating the problems caused by alcohol abuse. When Prohibition failed, and it did so spectacularly, it revealed the limits of moral reform movements, and specifically the paternalistic, prejudiced, and undemocratic ideals behind the dry crusade.","image_description":null,"preamble":null,"image_file":null},{"id":"doc6","title":"Document 6","source":"New York Times, December 6, 1933","type":"image_and_text","content":"PROHIBITION REPEAL IS RATIFIED AT 5:32 P.M.; ROOSEVELT ASKS NATION TO BAR THE SALOON; NEW YORK CELEBRATES WITH QUIET RESTRAINT. Sub-headlines: State House Bootlegger Is Barred in Maryland. CITY TOASTS NEW ERA. Crowds Swamp Licensed Resorts, but the Legal Liquor Is Scarce. CELEBRATION IN STREETS Marked by Absence of Undue Hilarity and Only Normal Number of Arrests. MANY SPEAKEASIES CLOSE. Machine Guns Guard Some Liquor Trucks — Supplies to Be Rushed Out Today. The Repeal Proclamation. FINAL ACTION AT CAPITAL. President Proclaims the Nation's New Policy as Utah Ratifies. PHILLIPS SIGNS DECREE. Orders 21st Amendment in Effect on Receiving Votes of Three Final States. RECOVERY TAXES TO END. $227,000,000 a Year Automatically Dropped — Canadian Whisky Quota Is Raised.","image_description":"Front page of the New York Times from December 6, 1933. Main headline: 'PROHIBITION REPEAL IS RATIFIED AT 5:32 P.M.; ROOSEVELT ASKS NATION TO BAR THE SALOON; NEW YORK CELEBRATES WITH QUIET RESTRAINT.' Sub-headlines include: 'State House Bootlegger Is Barred in Maryland,' 'CITY TOASTS NEW ERA,' 'Crowds Swamp Licensed Resorts, but the Legal Liquor Is Scarce,' 'CELEBRATION IN STREETS,' 'Marked by Absence of Undue Hilarity and Only Normal Number of Arrests,' 'MANY SPEAKEASIES CLOSE,' 'Machine Guns Guard Some Liquor Trucks — Supplies to Be Rushed Out Today,' 'The Repeal Proclamation,' 'FINAL ACTION AT CAPITAL,' 'President Proclaims the Nation's New Policy as Utah Ratifies,' 'PHILLIPS SIGNS DECREE,' 'Orders 21st Amendment in Effect on Receiving Votes of Three Final States,' 'RECOVERY TAXES TO END,' '$227,000,000 a Year Automatically Dropped — Canadian Whisky Quota Is Raised.'","preamble":"Although President Franklin Roosevelt supported repeal of Prohibition, he wanted to ban the operation of saloons, bars, and taverns in the United States.","image_file":"images/doc6_nyt_front_page.png"}],"scoreLevels":{"0":{"score":0,"bullets":[{"dimension":"overall","text":"Fails to develop the task or may only refer to the theme in a general way; OR includes no relevant facts, examples, or details; OR includes only the historical context and/or task as copied from the test booklet; OR includes only entire documents copied from the test booklet; OR is illegible; OR
