imension":"document_use","text":"Incorporates relevant information from at least four documents (see Key Ideas chart)"},{"dimension":"outside_information","text":"Incorporates relevant outside information (see Outside Information chart)"},{"dimension":"supporting_details","text":"Richly supports the theme with many relevant facts, examples, and details"},{"dimension":"organization","text":"Demonstrates a logical and clear plan of organization; includes an introduction and a conclusion that are beyond a restatement of the theme"}]}}};

const LS_KEY = "edsim_ratelikearater_v3";
const DIM_BY_ID = {};
SIM_DATA.dimensions.forEach(d => DIM_BY_ID[d.id] = d);

/* ---------------- Current anchor essay ---------------- */
const DEFAULT_ESSAY_ID = SIM_DATA.defaultEssayId || SIM_DATA.anchors[0].id;
let currentEssayId = DEFAULT_ESSAY_ID;
function currentEssay() {
  return SIM_DATA.anchors.find(a => a.id === currentEssayId) || SIM_DATA.anchors[0];
}

/* ---------------- Current practice paper (Rate the Essay) ---------------- */
const DEFAULT_PRACTICE_ID = SIM_DATA.defaultPracticeId || SIM_DATA.practices[0].id;
let currentPracticeId = DEFAULT_PRACTICE_ID;
function currentPractice() {
  return SIM_DATA.practices.find(p => p.id === currentPracticeId) || SIM_DATA.practices[0];
}
function ratingFor(id) {
  id = id || currentPracticeId;
  return state.ratings[id] || { score: null, justification: "", submitted: false };
}
function ensureRating(id) {
  if (!state.ratings[id]) state.ratings[id] = { score: null, justification: "", submitted: false };
  return state.ratings[id];
}

/* ---------------- State ---------------- */
// selections: { essayId: { dimId: { sentenceId: true } } }
// ratings:    { practiceId: { score, justification, submitted } }
function blankState() {
  return {
    name: "",
    period: "",
    currentEssayId: DEFAULT_ESSAY_ID,
    currentPracticeId: DEFAULT_PRACTICE_ID,
    selections: {},
    ratings: {}
  };
}
let state = blankState();
let activeIndex = 0;         // current panel index
let docActive = SIM_DATA.documents[0].id;

/* ---------------- Persistence (§5) ---------------- */
function save() {
  state.currentEssayId = currentEssayId;
  state.currentPracticeId = currentPracticeId;
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      state = Object.assign(blankState(), parsed);
      state.selections = parsed.selections || {};
      state.ratings = parsed.ratings || {};
      if (parsed.currentEssayId && SIM_DATA.anchors.some(a => a.id === parsed.currentEssayId)) {
        currentEssayId = parsed.currentEssayId;
      }
      if (parsed.currentPracticeId && SIM_DATA.practices.some(p => p.id === parsed.currentPracticeId)) {
        currentPracticeId = parsed.currentPracticeId;
      }
    }
  } catch (e) {}
}

/* ---------------- Panels model ---------------- */
// index 0 = Directions, 1..N = dimensions, N+1 = Rate the Essay
const PANELS = [{ kind: "intro", label: "Directions", icon: "📖" }]
  .concat(SIM_DATA.dimensions.map(d => ({ kind: "dim", id: d.id, label: d.label, icon: d.icon })))
  .concat([{ kind: "rate", label: "Rate the Essay", icon: "🎯" }]);

/* ---------------- Helpers ---------------- */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
// Selections are stored per essay: state.selections[essayId][dimId][sentenceId].
function selFor(dimId, essayId) {
  essayId = essayId || currentEssayId;
  return (state.selections[essayId] && state.selections[essayId][dimId]) || {};
}
function ensureSel(essayId, dimId) {
  if (!state.selections[essayId]) state.selections[essayId] = {};
  if (!state.selections[essayId][dimId]) state.selections[essayId][dimId] = {};
  return state.selections[essayId][dimId];
}
// Some dimensions (Task Identification) are scored by ASPECT, not by sentence:
// finding the topic sentence OR any sentence in a section credits that aspect.
function isAspectMode(dimId) {
  return (DIM_BY_ID[dimId] || {}).count_mode === "aspect";
}
function allAspects(dimId, essay) {
  essay = essay || currentEssay();
  const set = new Set();
  essay.sentences.forEach(s => {
    const t = s.tags[dimId];
    if (t && t.match && t.category) set.add(t.category);
  });
  return [...set];
}
function foundAspects(dimId, essay) {
  essay = essay || currentEssay();
  const sel = selFor(dimId, essay.id);
  const set = new Set();
  essay.sentences.forEach(s => {
    const t = s.tags[dimId];
    if (sel[s.id] && t && t.match && t.category) set.add(t.category);
  });
  return [...set];
}
function dimTotal(dimId, essay) {
  essay = essay || currentEssay();
  if (isAspectMode(dimId)) return allAspects(dimId, essay).length;
  return essay.sentences.filter(s => s.tags[dimId] && s.tags[dimId].match).length;
}
function dimFoundCorrect(dimId, essay) {
  essay = essay || currentEssay();
  if (isAspectMode(dimId)) return foundAspects(dimId, essay).length;
  const sel = selFor(dimId, essay.id);
  return essay.sentences.filter(s => sel[s.id] && s.tags[dimId] && s.tags[dimId].match).length;
}
function dimWrong(dimId, essay) {
  essay = essay || currentEssay();
  const sel = selFor(dimId, essay.id);
  return essay.sentences.filter(s => sel[s.id] && !(s.tags[dimId] && s.tags[dimId].match)).length;
}
function dimComplete(dimId, essay) {
  essay = essay || currentEssay();
  return dimTotal(dimId, essay) > 0 && dimFoundCorrect(dimId, essay) === dimTotal(dimId, essay);
}

/* ---------------- Build tab bar (§1) ---------------- */
function renderTabs() {
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  PANELS.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.index = i;
    const done = p.kind === "dim" && dimComplete(p.id);
    const dot = done ? '<span class="done-dot" aria-hidden="true"></span>' : "";
    b.innerHTML = `<span aria-hidden="true">${p.icon}</span> ${esc(p.label)} ${dot}`;
    if (p.kind === "rate") b.classList.add("rate-tab");
    if (i === activeIndex) b.classList.add("active");
    b.setAttribute("aria-current", i === activeIndex ? "true" : "false");
    b.addEventListener("click", () => goTo(i));
    bar.appendChild(b);
  });
}

/* ---------------- Sentence rendering ---------------- */
function renderEssayForDim(dimId) {
  const wrap = document.createElement("div");
  wrap.className = "essay";
  const essay = currentEssay();
  const sents = essay.sentences;
  const breaks = essay.paragraphs || [sents.length];
  let idx = 0;
  breaks.forEach(count => {
    const para = document.createElement("p");
    para.className = "para";
    for (let k = 0; k < count && idx < sents.length; k++, idx++) {
      const s = sents[idx];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "sentence";
      btn.dataset.sid = s.id;
      btn.setAttribute("aria-label", "Sentence: " + s.text);
      btn.textContent = s.text + " ";
      para.appendChild(btn);
      // feedback placeholder lives after the sentence
      const fb = document.createElement("span");
      fb.className = "fb-slot";
      fb.dataset.for = s.id;
      para.appendChild(fb);
      btn.addEventListener("click", () => toggleSentence(dimId, s.id));
    }
    wrap.appendChild(para);
  });
  return wrap;
}

function toggleSentence(dimId, sid) {
  const sel = ensureSel(currentEssayId, dimId);
  if (sel[sid]) delete sel[sid]; else sel[sid] = true;
  save();
  paintDim(dimId);
  renderTabs();
}

function paintDim(dimId) {
  const panel = document.getElementById("panel-" + dimId);
  if (!panel) return;
  const essay = currentEssay();
  const sel = selFor(dimId, essay.id);
  const sents = essay.sentences;
  sents.forEach(s => {
    const btn = panel.querySelector('.sentence[data-sid="' + CSS.escape(s.id) + '"]');
    const slot = panel.querySelector('.fb-slot[data-for="' + CSS.escape(s.id) + '"]');
    if (!btn || !slot) return;
    const tag = s.tags[dimId] || { match: false };
    btn.classList.remove("correct", "incorrect");
    btn.querySelector(".marker")?.remove();
    slot.innerHTML = "";
    if (sel[s.id]) {
      const ok = !!tag.match;
      btn.classList.add(ok ? "correct" : "incorrect");
      const mark = document.createElement("span");
      mark.className = "marker";
      mark.setAttribute("aria-hidden", "true");
      mark.textContent = ok ? "✓ " : "✗ ";
      btn.prepend(mark);
      const aspect = isAspectMode(dimId);
      // In aspect mode the head names the section, so the separate category line is redundant.
      const cat = (!aspect && tag.category) ? `<div class="fb-cat">Category: ${esc(tag.category.replace(/_/g, " "))}</div>` : "";
      let head;
      if (ok) {
        head = (aspect && tag.category)
          ? `✅ Yes — ${esc(tag.category.replace(/_/g, " "))} section`
          : "✅ Yes — this one counts";
      } else {
        head = "❌ Not for this dimension";
      }
      slot.innerHTML =
        `<span class="feedback ${ok ? "correct" : "incorrect"}">` +
        `<span class="fb-head">${head}</span>` +
        (tag.note ? esc(tag.note) : "") + cat + `</span>`;
    }
  });
  // progress
  const total = dimTotal(dimId);
  const found = dimFoundCorrect(dimId);
  const wrong = dimWrong(dimId);
  const pb = panel.querySelector(".progress-bar > span");
  if (pb) pb.style.width = (total ? Math.round(found / total * 100) : 0) + "%";
  const lab = panel.querySelector(".progress-label");
  if (lab) {
    const aspect = isAspectMode(dimId);
    if (total === 0) {
      // A dimension with no matches in this essay (e.g. Level 1 has no analytical
      // or outside-info sentences) — recognizing the absence is the lesson.
      const msg = (dimId === "document_use")
        ? "⚠️ This writer never cites a source document. The essay may read well, but with no documents used it can't score high — the task requires using at least four. Spotting that gap is the whole lesson here."
        : "This essay has no sentences for this dimension — noticing that is the point at this level.";
      lab.innerHTML =
        `<span style="color:var(--text-muted)">${msg}</span>` +
        (wrong ? ` &nbsp;·&nbsp; <span style="color:var(--incorrect)">${wrong} clicked, none match</span>` : "");
    } else {
      let foundList = "";
      if (aspect) {
        const names = foundAspects(dimId).map(c => esc(c.replace(/_/g, " ")));
        if (names.length) foundList = ` &nbsp;·&nbsp; <span style="color:var(--correct)">${names.join(", ")}</span>`;
      }
      lab.innerHTML =
        `Found <b>${found}</b> of <b>${total}</b> ${aspect ? "task aspects" : "in this essay"}` +
        foundList +
        (wrong ? ` &nbsp;·&nbsp; <span style="color:var(--incorrect)">${wrong} not a match</span>` : "") +
        (found === total ? ` &nbsp;·&nbsp; <span style="color:var(--correct)">complete ✓</span>` : "");
    }
  }
}

/* ---------------- Panel builders ---------------- */

  p.id = "panel-intro";
  const dimList = SIM_DATA.dimensions.map(d =>

  ).join("");
  p.innerHTML = `
    <h2 class="panel-title">Rate Like a Rater</h2>
    <p class="panel-sub">${esc(SIM_DATA.meta.exam)} Civic Literacy Essay · Topic: ${esc(SIM_DATA.meta.topic)} · ${SIM_DATA.anchors.length} sample essays to study (Essays ${esc(SIM_DATA.anchors[0].letter)}–${esc(SIM_DATA.anchors[SIM_DATA.anchors.length - 1].letter)})</p>

        <li><span class="num">2</span><div><b>Use the documents.</b> Tap <b>View Documents</b> any time to check the essay's claims against the six sources (or use your paper copies).</div></li>
        <li><span class="num">3</span><div><b>Rate the Essay (~8–10 min).</b> The last tab gives you fresh practice papers (A–${esc(String.fromCharCode(64 + SIM_DATA.practices.length))}). Pick one, read it, assign a score 0–5, and justify it — then reveal the official score and see how you did.</div></li>

      <p class="privacy-note">Total time: about 30–40 minutes. You can stop anytime — your work saves on this device automatically.</p>
    </div>

    <div class="card">

      <ul class="steps">${dimList}</ul>
    </div>

    <div class="card">
      <h3>Your name (optional)</h3>
      <p class="panel-sub" style="margin-bottom:8px">Only used to label your work when you copy it out. Nothing is sent anywhere.</p>
      <div class="meta-row">
        <div class="field"><label for="nameInput">First name</label><input id="nameInput" type="text" autocomplete="off" /></div>
        <div class="field"><label for="periodInput">Period</label><input id="periodInput" type="text" autocomplete="off" /></div>
      </div>
      <p class="privacy-note">🔒 This activity collects no personal data and never connects to the internet. When you "Copy My Work," this device is cleared for the next student.</p>
    </div>

    <div class="panel-nav">
      <span></span>
      <button class="btn primary" id="introNext">Start training →</button>
    </div>
  `;
  return p;
}

function buildDimPanel(dim) {
  const p = document.createElement("section");
  p.className = "panel";
  p.id = "panel-" + dim.id;
  const adv = dim.advanced ? '<span class="advanced-flag">Advanced</span>' : "";
  const levelOpts = SIM_DATA.anchors.map(a =>
    `<button type="button" class="level-opt${a.id === currentEssayId ? " active" : ""}" data-essay="${a.id}" aria-pressed="${a.id === currentEssayId}">Essay ${esc(a.letter)}</button>`
  ).join("");
  p.innerHTML = `
    <div class="taskbar">
      <div class="tb-head">
        <span class="tb-icon" aria-hidden="true">${dim.icon}</span>
        <h3>${esc(dim.label)}</h3>
        ${adv}
      </div>
      <p class="prompt">${esc(dim.student_prompt)}</p>
      ${dim.tip ? `<p class="dim-tip">💡 ${esc(dim.tip)}</p>` : ""}
      <div class="level-select" role="group" aria-label="Choose a sample essay">
        <span class="ls-label">Sample essay:</span>
        ${levelOpts}
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><span></span></div>
        <div class="progress-label"></div>
      </div>
    </div>
  `;
  p.appendChild(renderEssayForDim(dim.id));
  const navrow = document.createElement("div");
  navrow.className = "panel-nav";
  navrow.innerHTML = `<button class="btn" data-prev>← Previous</button><button class="btn" data-next>Next →</button>`;
  p.appendChild(navrow);
  return p;
}

function buildRatePanel() {
  const p = document.createElement("section");
  p.className = "panel";
  p.id = "panel-rate";
  const practice = currentPractice();
  const paras = practice.raw_text.split(/\n\n+/).map(t => `<p>${esc(t)}</p>`).join("");
  const scoreBtns = [0,1,2,3,4,5].map(n => `<button class="score-opt" type="button" data-score="${n}" aria-label="Score ${n}">${n}</button>`).join("");
  const practiceOpts = SIM_DATA.practices.map((pp, i) =>
    `<button type="button" class="level-opt${pp.id === currentPracticeId ? " active" : ""}" data-practice="${pp.id}" aria-pressed="${pp.id === currentPracticeId}">Paper ${String.fromCharCode(65 + i)}</button>`
  ).join("");
  p.innerHTML = `
    <div class="taskbar" style="border-left-color:var(--gold)">
      <div class="tb-head"><span class="tb-icon" aria-hidden="true">🎯</span><h3>Rate the Essay</h3></div>
      <p class="prompt">These are <b>practice papers</b> — not the anchors you trained on. Pick a paper, read it, assign a holistic score from 0 to 5, and justify your reasoning. When you submit, you'll see the official score and rater commentary.</p>
      <div class="level-select" role="group" aria-label="Choose a practice paper">
        <span class="ls-label">Practice paper:</span>
        ${practiceOpts}
      </div>
    </div>

    <div class="rate-essay">${paras}</div>

    <div class="card">
      <h3>Your score</h3>
      <div class="score-picker" id="scorePicker" role="group" aria-label="Choose a score 0 to 5">${scoreBtns}</div>
      <h3 style="margin-top:18px">Your justification</h3>
      <p class="panel-sub" style="margin-bottom:8px">Point to specific things in the essay. Which rubric dimensions are strong or weak?</p>
      <textarea class="justify" id="justifyBox" placeholder="This essay earns a ___ because..."></textarea>
      <div class="meta-row" style="margin-top:12px">
        <button class="btn" id="scaffoldBtn" type="button">✨ Auto-fill a starter template</button>
        <button class="btn gold" id="submitRateBtn" type="button">Submit &amp; reveal official score</button>
      </div>
    </div>

    <div id="revealMount"></div>

    <div class="panel-nav">
      <button class="btn" data-prev>← Previous</button>
      <span></span>
    </div>
  `;
  return p;
}

function buildReveal() {
  const mount = document.getElementById("revealMount");
  if (!mount) return;
  const practice = currentPractice();
  const rating = ratingFor(currentPracticeId);
  if (!rating.submitted || rating.score === null) { mount.innerHTML = ""; return; }
  const official = practice.score;
  const mine = rating.score;
  const diff = Math.abs(mine - official);
  let cls = "off", word = "Quite different";
  if (diff === 0) { cls = "match"; word = "Spot on — you rated like a rater!"; }
  else if (diff === 1) { cls = "close"; word = "Close — within one level of the official score."; }
  const levelBullets = (SIM_DATA.scoreLevels[String(official)] || { bullets: [] }).bullets
    .map(b => `<li><b>${esc((DIM_BY_ID[b.dimension] || {}).label || b.dimension)}:</b> ${esc(b.text)}</li>`).join("");
  mount.innerHTML = `
    <div class="reveal">
      <h3>Official Score &amp; Commentary</h3>
      <div class="score-compare">
        <div class="score-box"><div class="big" style="color:var(--gold)">${official}</div><div class="lbl">Official score</div></div>
        <div class="score-box"><div class="big">${mine}</div><div class="lbl">Your score</div></div>
      </div>
      <div class="verdict ${cls}">${word}</div>
      <p><b>What the rater said:</b><br>${esc(practice.rater_commentary_summary)}</p>
      <details class="rubric-ref">
        <summary>See the Level ${official} rubric descriptors</summary>
        <ul>${levelBullets}</ul>
      </details>
      <p class="privacy-note">Compare your justification above to the rater's reasoning. Did you notice the same strengths and gaps?</p>
    </div>
  `;
  mount.querySelector(".reveal").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------------- Navigation (§1, §12) ---------------- */
function showActivePanel(scroll) {
  document.querySelectorAll(".panel").forEach(el => el.classList.remove("active"));
  const p = PANELS[activeIndex];
  const id = p.kind === "intro" ? "panel-intro" : p.kind === "rate" ? "panel-rate" : "panel-" + p.id;
  const el = document.getElementById(id);
  if (el) el.classList.add("active");
  if (p.kind === "dim") paintDim(p.id);
  renderTabs();
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
}
function goTo(i) {
  activeIndex = Math.max(0, Math.min(PANELS.length - 1, i));
  showActivePanel(true);
}
// Switch the active anchor essay. Rebuilds the dimension panels for the new
// essay but keeps the student on the same dimension tab.
function setEssay(id) {
  if (id === currentEssayId || !SIM_DATA.anchors.some(a => a.id === id)) return;
  currentEssayId = id;
  save();
  rebuildDynamic();
  showActivePanel(false);
  const tb = document.querySelector(".panel.active .taskbar");
  if (tb) tb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
// Switch the practice paper in the Rate the Essay task (keeps each paper's own rating).
function setPractice(id) {
  if (id === currentPracticeId || !SIM_DATA.practices.some(p => p.id === id)) return;
  currentPracticeId = id;
  save();
  rebuildDynamic();
  showActivePanel(false);
  const tb = document.querySelector("#panel-rate .taskbar");
  if (tb) tb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------------- Export: Copy Text (§3 Option B, reset on success) ---------------- */
function buildExportText() {
  const L = [];
  L.push("RATE LIKE A RATER — my work");
  L.push(SIM_DATA.meta.exam + " · " + SIM_DATA.meta.topic);
  if (state.name || state.period) L.push("Student: " + (state.name || "—") + "   Period: " + (state.period || "—"));
  L.push("");
  SIM_DATA.anchors.forEach(essay => {
    const worked = SIM_DATA.dimensions.some(d => Object.keys(selFor(d.id, essay.id)).length > 0);
    if (!worked) return;
    L.push("==================================================");
    L.push("SAMPLE ESSAY " + essay.letter);
    L.push("==================================================");
    SIM_DATA.dimensions.forEach(d => {
      const sel = selFor(d.id, essay.id);
      if (!Object.keys(sel).length) return;
      const total = dimTotal(d.id, essay), found = dimFoundCorrect(d.id, essay), wrong = dimWrong(d.id, essay);
      const unit = isAspectMode(d.id) ? " task aspects" : "";
      L.push(`## ${d.label} — found ${found}/${total}${unit}` + (wrong ? `, ${wrong} not a match` : ""));
      essay.sentences.forEach(s => {
        if (sel[s.id]) {
          const ok = s.tags[d.id] && s.tags[d.id].match;
          L.push(`   ${ok ? "[✓]" : "[✗]"} ${s.text}`);
        }
      });
    });
    L.push("");
  });
  let ratedAny = false;
  SIM_DATA.practices.forEach((pp, i) => {
    const r = ratingFor(pp.id);
    if (r.score === null && !(r.justification && r.justification.trim())) return;
    ratedAny = true;
    L.push("## RATE THE ESSAY — Practice Paper " + String.fromCharCode(65 + i));
    L.push("My score: " + (r.score === null ? "(none)" : r.score) + "   Official score: " + pp.score);
    L.push("My justification:");
    L.push(r.justification || "(none written)");
    L.push("Official rater commentary:");
    L.push(pp.rater_commentary_summary);
    L.push("");
  });
  if (!ratedAny) L.push("## RATE THE ESSAY — (no paper rated yet)");
  return L.join("\n");
}

async function copyWork() {
  const text = buildExportText();
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    // Fallback for browsers/contexts without async clipboard
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e2) { ok = false; }
  }
  if (ok) {
    // §3/§5: reset only on confirmed success
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    state = blankState();
    currentEssayId = DEFAULT_ESSAY_ID;
    currentPracticeId = DEFAULT_PRACTICE_ID;
    docActive = SIM_DATA.documents[0].id;
    syncInputs();
    rebuildDynamic();
    goTo(0);
    toast("Copied! Paste it into your Google Doc. This device is now cleared for the next student.");
  } else {
    toast("Copy didn't go through — your work is still saved. Try again.");
  }
}

/* ---------------- Restart (manual) ---------------- */
function restart() {
  if (!confirm("Start over? This clears your selections, score, and justification on this device.")) return;
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  state = blankState();
  currentEssayId = DEFAULT_ESSAY_ID;
  currentPracticeId = DEFAULT_PRACTICE_ID;
  docActive = SIM_DATA.documents[0].id;
  syncInputs();
  rebuildDynamic();
  goTo(0);
  toast("Cleared. Starting fresh.");
}

/* ---------------- Documents drawer ---------------- */
function renderDocTabs() {
  const tabs = document.getElementById("docTabs");
  tabs.innerHTML = "";
  SIM_DATA.documents.forEach(d => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = d.title;
    if (d.id === docActive) b.classList.add("active");
    b.addEventListener("click", () => { docActive = d.id; renderDocTabs(); renderDocContent(); });
    tabs.appendChild(b);
  });
}
function renderDocContent() {
  const c = document.getElementById("docContent");
  const d = SIM_DATA.documents.find(x => x.id === docActive);
  if (!d) return;
  let html = `<div class="src">${esc(d.source)}</div>`;
  if (d.image_file) html += `<img src="${esc(d.image_file)}" alt="${esc(d.image_description || d.title)}" onerror="this.style.display='none'" />`;
  if (d.image_description) html += `<div class="img-desc"><b>Image:</b> ${esc(d.image_description)}</div>`;
  if (d.preamble) html += `<p><i>${esc(d.preamble)}</i></p>`;
  html += esc(d.content).split(/\n+/).map(t => `<p>${t}</p>`).join("");
  c.innerHTML = html;
  c.scrollTop = 0;
}
function openDocs() { document.getElementById("docOverlay").classList.add("open"); renderDocTabs(); renderDocContent(); }
function closeDocs() { document.getElementById("docOverlay").classList.remove("open"); }

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 4200);
}

/* ---------------- Input sync ---------------- */
function syncInputs() {
  const n = document.getElementById("nameInput");
  const pr = document.getElementById("periodInput");
  if (n) n.value = state.name || "";
  if (pr) pr.value = state.period || "";
  const rating = ratingFor(currentPracticeId);
  const jb = document.getElementById("justifyBox");
  if (jb) jb.value = rating.justification || "";
  document.querySelectorAll("#scorePicker .score-opt").forEach(b => {
    b.classList.toggle("selected", String(rating.score) === b.dataset.score);
  });
}

/* ---------------- Build all dynamic panels ---------------- */
function rebuildDynamic() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  main.appendChild(buildIntroPanel());
  SIM_DATA.dimensions.forEach(d => main.appendChild(buildDimPanel(d)));
  main.appendChild(buildRatePanel());
  wirePanels();
  syncInputs();
  SIM_DATA.dimensions.forEach(d => paintDim(d.id));
  buildReveal();
  renderTabs();
}

function wirePanels() {
  document.getElementById("introNext").addEventListener("click", () => goTo(1));
  document.getElementById("nameInput").addEventListener("input", e => { state.name = e.target.value; save(); });
  document.getElementById("periodInput").addEventListener("input", e => { state.period = e.target.value; save(); });

  document.querySelectorAll("[data-prev]").forEach(b => b.addEventListener("click", () => goTo(activeIndex - 1)));
  document.querySelectorAll("[data-next]").forEach(b => b.addEventListener("click", () => goTo(activeIndex + 1)));

  // Anchor-level selectors (one set per dimension panel)
  document.querySelectorAll(".level-opt[data-essay]").forEach(b =>
    b.addEventListener("click", () => setEssay(b.dataset.essay)));
  // Practice-paper selectors (Rate the Essay)
  document.querySelectorAll(".level-opt[data-practice]").forEach(b =>
    b.addEventListener("click", () => setPractice(b.dataset.practice)));

  // Rate panel — operates on the current practice paper's rating
  document.querySelectorAll("#scorePicker .score-opt").forEach(b => {
    b.addEventListener("click", () => {
      ensureRating(currentPracticeId).score = parseInt(b.dataset.score, 10);
      syncInputs(); save();
    });
  });
  const jb = document.getElementById("justifyBox");
  jb.addEventListener("input", e => { ensureRating(currentPracticeId).justification = e.target.value; save(); });
  document.getElementById("scaffoldBtn").addEventListener("click", () => {
    const rating = ensureRating(currentPracticeId);
    if (rating.justification && rating.justification.trim() &&
        !confirm("Replace what's in the justification box with a starter template?")) return;
    rating.justification = scaffoldTemplate();
    syncInputs(); save();
    toast("Starter template added — now edit it with your own evidence.");
  });
  document.getElementById("submitRateBtn").addEventListener("click", () => {
    const rating = ensureRating(currentPracticeId);
    if (rating.score === null) { toast("Pick a score from 0 to 5 first."); return; }
    rating.submitted = true; save();
    buildReveal();
  });
}

function scaffoldTemplate() {
  return [
    "I would score this essay a ___ out of 5.",
    "",
    "TASK DEVELOPMENT: The essay addresses historical circumstances by ___, efforts by ___, and impact by ___. One of these aspects is developed (more / less) than the others because ___.",
    "ANALYSIS vs. DESCRIPTION: It is mostly (descriptive / analytical) because ___.",
    "DOCUMENT USE: It uses information from ___ documents, such as ___.",
    "OUTSIDE INFORMATION: Outside the documents, the writer adds ___.",
    "SUPPORTING DETAILS: Specific facts include ___.",
    "ORGANIZATION: The introduction ___ and the conclusion ___ (does / does not) go beyond restating the theme.",
    "",
    "Overall, this fits Level ___ because ___."
  ].join("\n");
}

/* ---------------- Boot ---------------- */
function boot() {
  document.getElementById("appTitle").textContent = "Rate Like a Rater";
  document.getElementById("examTag").textContent = SIM_DATA.meta.exam + " · " + SIM_DATA.meta.topic;
  load();
  rebuildDynamic();
  goTo(0); // §12 always boot to Directions, regardless of saved progress

  document.getElementById("copyBtn").addEventListener("click", copyWork);
  document.getElementById("restartBtn").addEventListener("click", restart);
  document.getElementById("floatDocsBtn").addEventListener("click", openDocs);
  document.getElementById("docCloseBtn").addEventListener("click", closeDocs);
  document.getElementById("docOverlay").addEventListener("click", e => {
    if (e.target.id === "docOverlay") closeDocs();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeDocs();
  });
}
boot();
</script>
