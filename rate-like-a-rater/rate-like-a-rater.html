n any document — the student's own knowledge."},"outside_information":{"match":true,"note":"The rater credited this as outside information: with the U.S. fighting Germany in WWI, German Americans' link to beer made Prohibition a nativist and patriotic issue."},"supporting_details":{"match":false,"note":"Counted by the rater as outside information."},"organization":{"match":false,"category":"body","note":"Closing sentence of the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s17","text":"In document 3, Herbert Hoover—the president himself was taking initiative in regards to fully enforcing the ban on alcohol while calling Prohibition a \"noble experiment\".","tags":{"task_development":{"match":true,"category":"efforts","note":"Opens the efforts aspect — Hoover's enforcement initiative."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited the framing that Hoover took initiative to enforce the ban while calling Prohibition a 'noble experiment' as analytical."},"document_use":{"match":true,"document":"doc3","note":"Uses Document 3 (Hoover's enforcement and 'noble experiment' remark). Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":false,"note":"An interpretive topic sentence rather than a specific credited fact."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s18","text":"For instance he signed the \"Five and Ten Law,\" making every liquor violation a felony.\"","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with a specific law."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States what the law did without analysis."},"document_use":{"match":true,"document":"doc3","note":"From Document 3 — the 'Five and Ten Law' making every liquor violation a felony. Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":true,"note":"The rater credited 'Hoover signed the Five and Ten Law making every liquor violation a felony' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s19","text":"To many this was the way things should be done.","tags":{"task_development":{"match":true,"category":"efforts","note":"Notes public approval of strict enforcement."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A general statement of opinion."},"document_use":{"match":false,"note":"The student's own framing."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":false,"note":"A general statement rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s20","text":"However, the document also states by 1932, many wanted to repeal the 18th amendment which essentially made the manufacture and transportation of alcohol illegal.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — the growing push to repeal."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports document content and defines the 18th Amendment."},"document_use":{"match":true,"document":"doc3","note":"From Document 3 — by 1932 many wanted to repeal the 18th Amendment. Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3 (with the student's own definition of the amendment)."},"supporting_details":{"match":true,"note":"The rater credited 'by 1932 many wanted to repeal the 18th amendment, which made manufacture and transportation of alcohol illegal' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s21","text":"Once again this fueled fire between the two sides.","tags":{"task_development":{"match":true,"category":"impact","note":"Notes renewed conflict over Prohibition — part of its impact."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A transitional statement of conflict."},"document_use":{"match":false,"note":"The student's own framing."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":false,"note":"A general statement rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Transition within the efforts/impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s22","text":"Those who wanted the 18th amendment reported felt that it had only further increased the troubles in America.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the view that Prohibition worsened problems."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports a viewpoint without deeper analysis."},"document_use":{"match":false,"note":"The student's own framing."},"outside_information":{"match":false,"note":"A general claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s23","text":"Crime rates increased, smugglers were being more active and as a result gang violence also increased.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the rise in crime under Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Lists consequences without deeper analysis."},"document_use":{"match":false,"note":"Not stated in the documents — the student's own knowledge."},"outside_information":{"match":false,"note":"Outside the documents, but the rater listed this among supporting details rather than outside information."},"supporting_details":{"match":true,"note":"The rater credited 'crime rates increased, smugglers more active, and violence increased' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s24","text":"Conflicting attitudes about Prohibition can be seen in document 6, in which although \"President Franklin Roosevelt supported repeal of Prohibition, he wanted to ban the operation of saloons, bars, and taverns in the United States.\"","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — conflicting attitudes shown through FDR."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes the document to illustrate conflicting attitudes."},"document_use":{"match":true,"document":"doc6","note":"Quotation from Document 6 (FDR supported repeal but wanted to bar the saloon). Check Doc 6 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 6."},"supporting_details":{"match":true,"note":"The rater credited 'FDR supported repeal and wanted to ban operation of saloons, bars, and taverns' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s25","text":"Earlier President Hoover showed a contradictory attitude as shown in document 3 with his willingness to sign strict laws to enforce Prohibition to fulfill his constitutional duty but refused to personally endorse Prohibition.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — analyzing Hoover's enforcement stance."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this analysis of Hoover's contradictory attitude (enforcing strict laws out of constitutional duty while refusing to personally endorse Prohibition) as analytical."},"document_use":{"match":true,"document":"doc3","note":"Draws on Document 3 (Hoover ascribed his enforcement to constitutional duty, not personal endorsement). Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":false,"note":"An interpretive comparison rather than a specific credited fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s26","text":"This goes to show that this constitutional and civic issue was complicated and had everyone in a bind.","tags":{"task_development":{"match":true,"category":"impact","note":"Draws a conclusion about the complexity of the issue."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"An explicit analytical conclusion ('this goes to show... complicated and had everyone in a bind')."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An analytical conclusion rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s27","text":"It is clear that there were both benefits and negatives to Prohibition.","tags":{"task_development":{"match":true,"category":"impact","note":"Evaluative summary of Prohibition's mixed impact."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"An evaluative conclusion weighing benefits against negatives."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s28","text":"In fact, some women who initially supported the WCTU and Prohibition changed their minds when they saw an increase in distrust for the law.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — women turning toward repeal."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this (some women who initially supported Prohibition changed their minds as distrust for the law grew) as analytical."},"document_use":{"match":false,"note":"The student's own framing, related to the WONPR's story in Doc 4."},"outside_information":{"match":false,"note":"An analytical claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An analytical claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s29","text":"Having gained the right to vote, they became more politically active, gave speeches, and raised money in support of the repeal of the amendment.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — women's repeal activism."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Lists the women's activities."},"document_use":{"match":true,"document":"doc4","note":"Reflects Document 4 (WONPR women gave speeches and raised funds for repeal). Check Doc 4 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 4 (with the 19th-Amendment voting context)."},"supporting_details":{"match":true,"note":"The rater credited 'women became politically active after gaining the right to vote, gave speeches, and raised money in support of repeal' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s30","text":"The WONPR and their efforts to address prohibition made a difference because they represented the new and more modern women of the 1920s.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — the significance of the WONPR."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this (the WONPR made a difference because they represented the new, modern women of the 1920s) as analytical."},"document_use":{"match":false,"note":"The student's own evaluation."},"outside_information":{"match":false,"note":"An evaluation rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s31","text":"This issue continued to give women the opportunity to play an important public role in society and further their involvement in addressing other issues as they stressed their worry about the government and it's increasing regulations.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — Prohibition's longer effect on women's public role."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this (Prohibition continued to give women a public role and furthered their involvement in other issues) as analytical."},"document_use":{"match":false,"note":"The student's own evaluation."},"outside_information":{"match":false,"note":"An evaluation rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact discussion."},"inaccuracy":{"match":false}}},{"id":"5-s32","text":"Nonetheless, as document 5 states, \"Prohibition failed, and it did so spectacularly, as it revealed the limits of moral reform movements.\"","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect with Doc 5's verdict on Prohibition's failure."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes the document's conclusion."},"document_use":{"match":true,"document":"doc5","note":"Quotation from Document 5 (Prohibition failed spectacularly, revealing the limits of moral reform). Check Doc 5 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 5."},"supporting_details":{"match":true,"note":"The rater credited 'Prohibition revealed the limits of moral reform movements' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Closing sentence of the efforts/impact paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s33","text":"The efforts of groups such as the Anti-Saloon League led to the 18th Amendment which had a huge impact on the country.","tags":{"task_development":{"match":true,"category":"impact","note":"Topic sentence opening the impact paragraph."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the impact at a general level as a topic sentence."},"document_use":{"match":false,"note":"General framing, not a specific document citation."},"outside_information":{"match":false,"note":"General framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A general topic sentence rather than a specific fact."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s34","text":"People were forced to drink less and with saloons closed many families were happier.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — positive effects of Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States effects without analysis."},"document_use":{"match":false,"note":"The student's own knowledge."},"outside_information":{"match":false,"note":"A general claim rather than a discrete credited outside fact."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s35","text":"However, crime became a national problem.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the rise of national crime."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States a consequence without analysis."},"document_use":{"match":false,"note":"The student's own knowledge."},"outside_information":{"match":false,"note":"A general claim rather than a discrete credited outside fact."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s36","text":"Women worried about the increase in underage drinking and many people believed the government should not interfere with personal liberty.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — concerns about underage drinking and government overreach."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports public concerns."},"document_use":{"match":false,"note":"Not tied to a specific document here — the student's own knowledge."},"outside_information":{"match":true,"note":"The rater credited 'many people believed the government should not interfere with personal liberty' as outside information."},"supporting_details":{"match":false,"note":"Counted by the rater as outside information."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s37","text":"It cost millions of dollars a year to enforce at a time when money was scarce—the Great Depression.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the cost of enforcement during the Depression."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the cost as background."},"document_use":{"match":false,"note":"Echoes Doc 5's 'millions of dollars a year' but the Great Depression context is the student's own knowledge; the rater credited it as outside information."},"outside_information":{"match":true,"note":"The rater credited this as outside information: enforcement cost millions of dollars a year when money was scarce during the Great Depression."},"supporting_details":{"match":false,"note":"Counted by the rater as outside information."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s38","text":"The impact of those who fought for repeal was also significant since as document 5 states it \"revealed the limit of moral reform movements\" and the problem with \"a vocal minority trying to regulate the personal habits of all Americans.\"","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — what the repeal movement revealed."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited the point about 'a vocal minority trying to regulate the personal habits of all Americans' as analytical, integrating the Doc 5 quotation into an argument."},"document_use":{"match":true,"document":"doc5","note":"Quotation from Document 5 (limits of moral reform; a vocal minority regulating personal habits). Check Doc 5 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 5."},"supporting_details":{"match":false,"note":"Used analytically rather than as a standalone credited fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s39","text":"Lots of time, money, and effort was put into prohibition—yet it was not something that solidified the Nation.","tags":{"task_development":{"match":true,"category":"impact","note":"Concluding evaluation of Prohibition's overall effect."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"An evaluative conclusion (much was invested, yet it did not solidify the nation)."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative conclusion rather than a specific fact."},"organization":{"match":true,"category":"conclusion","note":"Conclusion sentence that goes beyond restating the theme by weighing the effort against the outcome."},"inaccuracy":{"match":false}}},{"id":"5-s40","text":"Despite this, it enable various new points and groups of people to arise and take initiative.","tags":{"task_development":{"match":true,"category":"impact","note":"Final evaluation — Prohibition enabled new groups to mobilize."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"A closing analytical point that the debate empowered new groups to take initiative."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative conclusion rather than a specific fact."},"organization":{"match":true,"category":"conclusion","note":"Final sentence — lifts the conclusion beyond a restatement by noting a broader, lasting effect."},"inaccuracy":{"match":false}}}]},{"id":"level_1","letter":"D","score":1,"paragraphs":[2,3,3,2,1],"sentences":[{"id":"1-s01","text":"The prohibition and the efforts to address the prohibition where not in vain for some of these efforts succeeded others did not.","tags":{"task_development":{"match":false,"note":"Opening generalization; does not develop a specific task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive opening — the rater judged the whole essay to be descriptive."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"The rater found no relevant outside information in this essay."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"First sentence of the introduction, which is a restatement of the theme. The rater noted the essay lacks a conclusion."},"inaccuracy":{"match":false}}},{"id":"1-s02","text":"I will be discussing three topics in the essay, one historical circumstances, two efforts by individuals, groups, and/or government to address this issue, and three the impact of these efforts.","tags":{"task_development":{"match":false,"note":"Announces the three parts of the task but does not yet develop any of them — it just lists the prompt's requirements."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Restates the task wording."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"A 'roadmap' sentence — part of the introduction restating the three parts of the task."},"inaccuracy":{"match":false}}},{"id":"1-s03","text":"One effort to address the prohibition was making liquor selling and distribution illegal.","tags":{"task_development":{"match":true,"category":"efforts","note":"Topic sentence introducing the first effort."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States an effort without analysis."},"document_use":{"match":false,"note":"General statement; the document quotation follows."},"outside_information":{"match":false,"note":"No outside knowledge."},"supporting_details":{"match":true,"note":"The rater credited 'making liquor selling and distribution illegal' as one of the essay's few supporting details."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the first efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"1-s04","text":"In the first paragraph of Document three it states \"...Over his first three years in the White House Hoover never wavered in his support for the prohibition. In 1929 he signed the 'Five and ten Law' making every liquor violation a felony...\"","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with a long quotation from Doc 3."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Copies a quotation from the document without interpretation."},"document_use":{"match":true,"document":"doc3","note":"Direct quotation from Document 3 (Hoover's support; the 1929 'Five and Ten Law'). Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":true,"note":"The rater credited 'Hoover signed the Five and Ten Law making every liquor violation a felony' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence (the quoted evidence) in the first efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"1-s05","text":"Showing his support of the prohibition he has outlawed liquor hoping that this would stop people from selling and drinking liquor.","tags":{"task_development":{"match":true,"category":"efforts","note":"Explains the purpose of Hoover's effort."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"The rater judged this 'Hoover hoped Prohibition would stop people from selling and drinking liquor' as descriptive rather than analytical."},"document_use":{"match":false,"note":"The student's own restatement, not document text."},"outside_information":{"match":false,"note":"No outside knowledge."},"supporting_details":{"match":false,"note":"Restates the quotation's point rather than adding a specific fact."},"organization":{"match":false,"category":"body","note":"Closing sentence of the first efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"1-s06","text":"Another effect to address the prohibition was for members of a group called WONPR talking about the prohibition in a public setting.","tags":{"task_development":{"match":true,"category":"efforts","note":"Topic sentence introducing the second effort (the WONPR)."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the effort without analysis."},"document_use":{"match":false,"note":"General statement; the document quotation follows."},"outside_information":{"match":false,"note":"No outside knowledge."},"supporting_details":{"match":true,"note":"The rater credited 'members of WONPR talked about Prohibition in a public setting' as a supporting detail."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the second efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"1-s07","text":"In Document four the second paragraph \"WONPR did a lot of what we think of now as typical political campaigning activities: members attended meetings and gave speeches at rallies.\"","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with a quotation from Doc 4."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Copies a quotation without interpretation."},"document_use":{"match":true,"document":"doc4","note":"Direct quotation from Document 4 (WONPR campaign activities). Check Doc 4 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 4."},"supporting_details":{"match":true,"note":"The rater credited 'WONPR members attended meetings and gave speeches at rallies' as a supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence (the quoted evidence) in the second efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"1-s08","text":"Showing the people supporting the prohibition would go to great lengths to protect it.","tags":{"task_development":{"match":true,"category":"efforts","note":"States the point of the WONPR example — but the claim is factually wrong (see Inaccuracies)."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"The rater judged this descriptive; it is also factually mistaken."},"document_use":{"match":false,"note":"The student's own (incorrect) conclusion, not document text."},"outside_information":{"match":false,"note":"No outside knowledge."},"supporting_details":{"match":false,"note":"Inaccurate, so not a credited supporting detail."},"organization":{"match":false,"category":"body","note":"Closing sentence of the second efforts paragraph."},"inaccuracy":{"match":true,"note":"Inaccuracy — the WONPR fought to REPEAL Prohibition, not to 'support' or 'protect' it. The essay describes them as people supporting Prohibition, which is backwards. (See Doc 4.)"}}},{"id":"1-s09","text":"Some historical context of this prohibition was the temperance crusades in document one the text states \"The prohibition movement was an outgrowth of the temperance crusades.\"","tags":{"task_development":{"match":true,"ca ircumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"3-s15","text":"As shown in Document 2, this group kept track of the progress National Prohibition was making in state legislatures with ratification of the Prohibition Amendment.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances using Doc 2."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports what the document shows without interpretation."},"document_use":{"match":true,"document":"doc2","note":"Explicitly cites Document 2 (Anti-Saloon League ratification map) and paraphrases it accurately. Check Doc 2 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 2."},"supporting_details":{"match":true,"note":"Specific document-based detail about tracking ratification progress in state legislatures — credited by the rater."},"organization":{"match":false,"category":"body","note":"Closing supporting sentence of the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"3-s16","text":"Efforts had to be made by many to continue to address the issue of prohibition after the Amendment was passed.","tags":{"task_development":{"match":true,"category":"efforts","note":"Topic sentence announcing the efforts aspect of the task."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this framing ('efforts had to be made... after the amendment was passed') as an analytical statement that organizes the discussion of efforts."},"document_use":{"match":false,"note":"No specific document information."},"outside_information":{"match":false,"note":"Framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No concrete detail yet — details follow in this paragraph."},"organization":{"match":true,"category":"body","note":"Topic sentence introducing the second task aspect — efforts to address the issue."},"inaccu
