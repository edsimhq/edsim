<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rate Like a Rater — Level 3</title>
<style>
  :root {
    --bg-base: #0f1117;
    --bg-card: #1c1f2b;
    --bg-card-hover: #22263a;
    --bg-elevated: #262b3d;
    --text-primary: #f0f0f0;
    --text-muted: #9aa3b2;
    --border: #2a2f40;
    --accent: #e8ff47;
    --accent-secondary: #ff6b35;
    --correct: #3ecf8e;
    --correct-bg: rgba(62, 207, 142, 0.14);
    --correct-border: rgba(62, 207, 142, 0.55);
    --incorrect: #ff7b7b;
    --incorrect-bg: rgba(255, 107, 107, 0.14);
    --incorrect-border: rgba(255, 107, 107, 0.5);
    --gold: #ffd24a;
    --gold-bg: rgba(255, 210, 74, 0.12);
    --radius: 10px;
    --maxw: 1180px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    line-height: 1.55;
  }

  /* ---------- Header ---------- */
  header.app-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header.app-header h1 {
    font-size: 1.15rem;
    margin: 0;
    color: var(--accent);
    letter-spacing: 0.2px;
  }
  header.app-header .exam-tag {
    font-size: 0.8rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 3px 9px;
    border-radius: 999px;
  }
  header.app-header .spacer { flex: 1; }

  .btn {
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-primary);
    padding: 9px 14px;
    min-height: 44px;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--bg-card-hover); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.gold { background: var(--gold); color: #2a2200; border-color: var(--gold); font-weight: 600; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---------- Tab nav ---------- */
  nav.tabbar {
    position: sticky;
    top: 61px;
    z-index: 30;
    background: var(--bg-base);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 4px;
    padding: 8px 14px;
    overflow-x: auto;
  }
  nav.tabbar button {
    font: inherit;
    font-size: 0.82rem;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    padding: 8px 12px;
    min-height: 44px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  nav.tabbar button:hover { background: var(--bg-card); color: var(--text-primary); }
  nav.tabbar button.active {
    background: var(--bg-card);
    color: var(--accent);
    border-color: var(--border);
    font-weight: 600;
  }
  nav.tabbar button .done-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--correct);
    display: inline-block;
  }
  nav.tabbar button.rate-tab { color: var(--gold); }
  nav.tabbar button.rate-tab.active { color: var(--gold); }

  main { max-width: var(--maxw); margin: 0 auto; padding: 22px 18px 90px; }

  .panel { display: none; }
  .panel.active { display: block; }

  h2.panel-title { font-size: 1.4rem; margin: 0 0 4px; }
  .panel-sub { color: var(--text-muted); margin: 0 0 18px; }

  /* ---------- Directions ---------- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .steps li { display: flex; gap: 12px; align-items: flex-start; }
  .steps .num {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: #1a1a1a; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
  }
  .meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.8rem; color: var(--text-muted); }
  .field input {
    font: inherit; padding: 10px 12px; min-height: 44px;
    background: var(--bg-base); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-primary); min-width: 160px;
  }
  .field input:focus-visible { outline: 2px solid var(--accent); }
  .privacy-note { font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; }

  /* ---------- Task bar ---------- */
  .taskbar {
    background: linear-gradient(180deg, var(--bg-elevated), var(--bg-card));
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
    position: sticky;
    top: 118px;
    z-index: 20;
  }
  .taskbar .tb-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .taskbar .tb-icon { font-size: 1.4rem; }
  .taskbar h3 { margin: 0; font-size: 1.1rem; }
  .taskbar .advanced-flag {
    font-size: 0.72rem; background: var(--accent-secondary); color: #fff;
    padding: 2px 8px; border-radius: 999px;
  }
  .taskbar .prompt { margin: 8px 0 0; color: var(--text-primary); }
  .taskbar .dim-tip {
    margin: 9px 0 0; padding: 9px 12px; font-size: 0.86rem;
    color: var(--text-primary); background: rgba(232, 255, 71, 0.08);
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 7px;
  }
  .taskbar .progress-wrap { margin-top: 12px; }
  .progress-bar {
    height: 9px; background: var(--bg-base); border-radius: 999px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar > span { display: block; height: 100%; width: 0; background: var(--correct); transition: width 0.3s; }
  .progress-label { font-size: 0.82rem; color: var(--text-muted); margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
  .progress-label b { color: var(--text-primary); }

  .level-select { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .level-select .ls-label { font-size: 0.8rem; color: var(--text-muted); margin-right: 2px; }
  .level-opt { font: inherit; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--border); background: var(--bg-base); color: var(--text-muted); padding: 7px 13px; min-height: 40px; border-radius: 7px; }
  .level-opt:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  .level-opt.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  .level-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Essay sentences ---------- */
  .essay {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    font-size: 1.02rem;
  }
  .essay .para { margin: 0 0 14px; }
  .sentence {
    font: inherit;
    font-size: inherit;
    text-align: left;
    line-height: 1.6;
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-primary);
    padding: 1px 3px;
    border-radius: 5px;
    transition: background 0.12s;
    display: inline;
  }
  .sentence:hover { background: var(--bg-card-hover); }
  .sentence:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sentence.correct { background: var(--correct-bg); border-color: var(--correct-border); }
  .sentence.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); }
  .sentence .marker { font-weight: 700; margin-right: 3px; }
  .sentence.correct .marker { color: var(--correct); }
  .sentence.incorrect .marker { color: var(--incorrect); }

  .feedback {
    display: block;
    margin: 8px 0 12px;
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    border-left: 3px solid var(--border);
    background: var(--bg-elevated);
  }
  .feedback.correct { border-left-color: var(--correct); }
  .feedback.incorrect { border-left-color: var(--incorrect); }
  .feedback .fb-head { font-weight: 700; margin-bottom: 3px; display: block; }
  .feedback.correct .fb-head { color: var(--correct); }
  .feedback.incorrect .fb-head { color: var(--incorrect); }
  .feedback .fb-cat { color: var(--text-muted); font-size: 0.82rem; }

  /* ---------- Bottom nav ---------- */
  .panel-nav {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 20px;
  }

  /* ---------- Rate the Essay ---------- */
  .rate-essay {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  }
  .rate-essay p { margin: 0 0 13px; }
  .score-picker { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; }
  .score-opt {
    width: 58px; height: 58px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg-elevated);
    color: var(--text-primary); font-size: 1.3rem; font-weight: 700; cursor: pointer;
  }
  .score-opt:hover { background: var(--bg-card-hover); }
  .score-opt:focus-visible { outline: 2px solid var(--gold); }
  .score-opt.selected { background: var(--gold); color: #2a2200; border-color: var(--gold); }
  textarea.justify {
    width: 100%; min-height: 150px; resize: vertical;
    font: inherit; padding: 12px 14px; background: var(--bg-base);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary);
  }
  textarea.justify:focus-visible { outline: 2px solid var(--gold); }

  .reveal { border: 1px solid var(--gold); border-radius: var(--radius); padding: 18px 20px; margin-top: 16px; background: var(--gold-bg); }
  .reveal h3 { margin-top: 0; color: var(--gold); }
  .score-compare { display: flex; gap: 20px; flex-wrap: wrap; margin: 12px 0; }
  .score-box { text-align: center; }
  .score-box .big { font-size: 2.2rem; font-weight: 800; }
  .score-box .lbl { font-size: 0.78rem; color: var(--text-muted); }
  .verdict { font-weight: 700; padding: 10px 14px; border-radius: 8px; margin: 10px 0; }
  .verdict.match { background: var(--correct-bg); color: var(--correct); }
  .verdict.close { background: var(--gold-bg); color: var(--gold); }
  .verdict.off { background: var(--incorrect-bg); color: var(--incorrect); }

  details.rubric-ref { margin-top: 12px; }
  details.rubric-ref summary { cursor: pointer; color: var(--text-muted); }
  details.rubric-ref ul { margin: 8px 0; padding-left: 18px; }

  /* ---------- Document drawer ---------- */
  .doc-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; z-index: 60;
  }
  .doc-overlay.open { display: block; }
  .doc-drawer {
    position: absolute; top: 0; right: 0; height: 100%;
    width: min(560px, 92vw); background: var(--bg-card);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .doc-drawer header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .doc-drawer header h3 { margin: 0; font-size: 1.05rem; flex: 1; }
  .doc-tabs { display: flex; gap: 4px; padding: 10px 14px; overflow-x: auto; border-bottom: 1px solid var(--border); }
  .doc-tabs button {
    font: inherit; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-muted);
    padding: 7px 11px; min-height: 40px; border-radius: 7px;
  }
  .doc-tabs button.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  .doc-content { padding: 16px 18px; overflow-y: auto; }
  .doc-content .src { color: var(--text-muted); font-size: 0.82rem; font-style: italic; margin-bottom: 10px; }
  .doc-content .img-desc { background: var(--bg-elevated); border-left: 3px solid var(--accent-secondary); padding: 10px 12px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 12px; }
  .doc-content img { max-width: 100%; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elevated); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 10px; padding: 13px 18px;
    z-index: 80; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .float-docs {
    position: fixed; bottom: 20px; right: 20px; z-index: 35;
  }

  @media (max-width: 768px) {
    header.app-header h1 { font-size: 1rem; }
    .taskbar { position: static; }
    nav.tabbar { top: 57px; }
  }
</style>
</head>
<body>
<header class="app-header">
  <h1 id="appTitle">Rate Like a Rater</h1>
  <span class="exam-tag" id="examTag"></span>
  <span class="spacer"></span>
  <button class="btn ghost" id="copyBtn">📋 Copy My Work</button>
  <button class="btn ghost" id="restartBtn">↺ Start Over</button>
</header>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<main id="main"></main>

<button class="btn primary float-docs" id="floatDocsBtn" aria-label="View source documents">📄 View Documents</button>

<!-- Document drawer -->
<div class="doc-overlay" id="docOverlay">
  <div class="doc-drawer" role="dialog" aria-label="Source documents" aria-modal="true">
    <header>
      <h3>Source Documents</h3>
      <button class="btn ghost" id="docCloseBtn" aria-label="Close documents">✕ Close</button>
    </header>
    <div class="doc-tabs" id="docTabs"></div>
    <div class="doc-content" id="docContent"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================================
   Rate Like a Rater — anchor training (Levels 4 / 3 / 2) + Rate the Essay
   Data is inlined below (generated from rubric.json / documents.json /
   essays.json by build.js) so the file runs standalone with no server.
   Compliance: §0 no PII sent anywhere; §1 tab + next/prev nav; §2 directions
   first; §3 Copy Text export with reset-on-success; §5 localStorage autosave;
   §6 keyboard + aria + 44px targets; §10 CSS variables; §12 always boot to
   Directions; §14 all feedback hand-built, no AI.
   ========================================================================= */
const SIM_DATA = {"meta":{"title":"Rate Like a Rater","exam":"January 2026","topic":"Prohibition"},"dimensions":[{"id":"task_development","label":"Task Identification","icon":"📋","student_prompt":"Find where the essay addresses each of the three parts of the task: historical circumstances, efforts to address the issue, and impact. Identifying the topic sentence — or any sentence in that section — is enough.","description":"Does the essay address all three parts of the task: historical circumstances, efforts, and impact?","count_mode":"aspect"},{"id":"document_use","label":"Document Use","icon":"📄","student_prompt":"Find sentences where the essay uses information from the source documents — look for \"Document 1\", direct quotes, or a clear paraphrase of a source. Check the side panel to verify.","description":"Does the essay incorporate relevant information from the source documents? How many documents are used?","tip":"Why this matters: the task requires using at least four documents. An essay can sound smart and be totally accurate, yet still score low if it never cites the documents. As you compare essays, notice which ones point to Docs 1–6 — and which don't."},{"id":"supporting_details","label":"Supporting Details","icon":"📌","student_prompt":"Find sentences that include specific facts, examples, statistics, names, dates, or other concrete details that support the essay's claims.","description":"Does the essay include specific facts, examples, and details — or is it vague and general?"},{"id":"analytical_vs_descriptive","label":"Analysis vs. Description","icon":"🔬","student_prompt":"Find sentences that ANALYZE (explain why, evaluate, draw conclusions) rather than just DESCRIBE (state facts without interpretation).","description":"Does the essay analyze, evaluate, and draw conclusions — or does it just retell facts?"},{"id":"outside_information","label":"Outside Information","icon":"🌍","student_prompt":"Find sentences that include relevant historical knowledge NOT found in any of the 6 source documents.","description":"Does the essay bring in relevant knowledge beyond what the documents provide?"},{"id":"organization","label":"Organization","icon":"🏗️","student_prompt":"Find the introduction, the conclusion, and the topic sentence that opens each body section. Does each section start with a simple sentence that says what it's about?","description":"Does the essay have a logical plan, a real introduction, and a meaningful conclusion?","tip":"Why this matters: strong essays open each section with a simple topic sentence — \"One effort to address Prohibition was...\" — and start a new paragraph for each part of the task. Notice which essays signpost their sections clearly, and which run everything together."},{"id":"inaccuracy","label":"Inaccuracies","icon":"⚠️","student_prompt":"Find sentences that contain historical errors, misattributions, or factual mistakes. Check claims against the source documents and your own knowledge.","description":"Does the essay contain factual errors? This is an advanced skill — can you spot what the writer got wrong?","advanced":true}],"anchors":[{"id":"level_2","letter":"A","score":2,"paragraphs":[17,7,4],"sentences":[{"id":"2-s01","text":"Throughout United States history, many Constitutional and Civic issues have been debated by Americans.","tags":{"task_development":{"match":false,"note":"Opening generalization copied from the prompt; does not develop a task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive restatement of the prompt."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"First sentence of the introduction. The rater noted the intro is a restatement of the historical context."},"inaccuracy":{"match":false}}},{"id":"2-s02","text":"These debates have resulted in the efforts by individuals, groups, and governments to address these issues.","tags":{"task_development":{"match":false,"note":"General framing echoing the prompt, not about Prohibition specifically."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive restatement."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"Introduction sentence restating the prompt."},"inaccuracy":{"match":false}}},{"id":"2-s03","text":"These efforts have achieved varying degrees of success.","tags":{"task_development":{"match":false,"note":"General framing; does not develop a task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive framing."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"Introduction sentence."},"inaccuracy":{"match":false}}},{"id":"2-s04","text":"One of these Constitutional and Civic issues is Prohibition.","tags":{"task_development":{"match":false,"note":"Names the topic but does not yet develop a task aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive — states the topic."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"Names the topic, completing the restatement-style introduction."},"inaccuracy":{"match":false}}},{"id":"2-s05","text":"In the early 19th century heavy drinking was very common amongst Americans, rum was consumed excessively.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Begins the historical-circumstances aspect — the drinking culture that led to Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States a background fact without interpretation."},"document_use":{"match":false,"note":"Echoes Doc 1's point about rum, but no citation; the rater treated it as a supporting detail."},"outside_information":{"match":false,"note":"Treated as a supporting detail, not outside information."},"supporting_details":{"match":true,"note":"Specific detail the rater credited: rum was consumed excessively."},"organization":{"match":false,"category":"body","note":"Background sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s06","text":"During 1827, in Maine alone, \"When her population was 360,000, manufactured 1,333,160 gallons of liquor\" (Document 1).","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances with a statistic from Doc 1."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes a statistic without interpreting it."},"document_use":{"match":true,"document":"doc1","note":"Direct quotation/statistic from Document 1 (Maine, 1827). Check Doc 1 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 1."},"supporting_details":{"match":true,"note":"Concrete statistic (1,333,160 gallons) credited by the rater."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s07","text":"Americans, mainly men, were consuming massive amounts of hard liquor every day.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the scale of drinking."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes the drinking without analysis."},"document_use":{"match":false,"note":"General statement, not from a document."},"outside_information":{"match":false,"note":"General claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"General, not a specific fact or statistic."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s08","text":"This resulted in disastrous Social Consequences.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Transitions into the social effects of drinking — historical circumstances."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"General claim; the specifics follow."},"document_use":{"match":false,"note":"Echoes Doc 1's 'disastrous social consequences' phrasing but is used as a general lead-in."},"outside_information":{"match":false,"note":"General framing."},"supporting_details":{"match":false,"note":"No specific detail yet."},"organization":{"match":false,"category":"body","note":"Lead-in sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s09","text":"Man became to drunk to work, lost their jobs, and spent all there money at bars.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — consequences of heavy drinking."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this as a (weak) application — an attempt to spell out the effects of drinking."},"document_use":{"match":false,"note":"Not from a document — the student's own elaboration."},"outside_information":{"match":false,"note":"The rater counted this as weak application/analysis rather than outside information."},"supporting_details":{"match":false,"note":"General consequence rather than a specific named fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s10","text":"In addition to this men became violent at home, often abusing there children and wives.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — domestic consequences of drinking."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this as a (weak) application of the effects of drinking on families."},"document_use":{"match":false,"note":"Not from a document — the student's own elaboration."},"outside_information":{"match":false,"note":"Counted by the rater as weak application, not outside information."},"supporting_details":{"match":false,"note":"General consequence rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s11","text":"Women although not doing the majority of the drinking were severely impacted.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — how drinking affected women."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States that women were impacted without explaining or evaluating."},"document_use":{"match":false,"note":"Not from a document."},"outside_information":{"match":false,"note":"Lead-in to the outside-information point that follows."},"supporting_details":{"match":false,"note":"General claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s12","text":"Women relied on there husbands for money, shelter, and food.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — women's economic dependence."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive background."},"document_use":{"match":false,"note":"Not in any document — the student's own knowledge."},"outside_information":{"match":true,"note":"The rater credited this as the essay's (little) outside information: women's dependence on husbands for money, shelter, and food."},"supporting_details":{"match":false,"note":"Counted as outside information rather than a specific supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s13","text":"Due to the drinking many families were left without.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — families left destitute."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive consequence."},"document_use":{"match":false,"note":"Not from a document."},"outside_information":{"match":true,"note":"Part of the outside-information point the rater credited (drinking left many families without)."},"supporting_details":{"match":false,"note":"General consequence rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s14","text":"This led to the creation of organizations such as the Anti-Saloon league, and the Womans organization for National prohibition.","tags":{"task_development":{"match":true,"category":"efforts","note":"Begins the efforts aspect — groups forming to address the issue."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Names groups without analysis."},"document_use":{"match":false,"note":"The group names appear in Docs 2 and 4, but the rater treated this as a supporting detail rather than document use."},"outside_information":{"match":false,"note":"Treated as a supporting detail."},"supporting_details":{"match":true,"note":"Names specific organizations (Anti-Saloon League, WONPR) — credited by the rater."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s15","text":"Both organizations fought to ban Alcohol.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — but the claim is factually wrong (see Inaccuracies)."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater counted this as a FAULTY application — an attempt to draw a conclusion that is factually incorrect."},"document_use":{"match":false,"note":"Not document-based; it also contradicts Doc 4."},"outside_information":{"match":false,"note":"An incorrect claim rather than outside information."},"supporting_details":{"match":false,"note":"Inaccurate, so not a credited supporting detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":true,"note":"Inaccuracy — the Women's Organization for National Prohibition Reform (WONPR) fought to REPEAL Prohibition, not to ban alcohol. Only the Anti-Saloon League sought a ban. (See Doc 4.)"}}},{"id":"2-s16","text":"This led to the passing of Prohibition on Anti-Alcohol law.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — the passage of Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the outcome without analysis."},"document_use":{"match":false,"note":"General statement, not from a document."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":false,"note":"Vague phrasing ('Prohibition on Anti-Alcohol law') rather than a precise fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s17","text":"Although many people did not like this.","tags":{"task_development":{"match":false,"note":"Sentence fragment foreshadowing opposition; does not develop a task aspect on its own."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"A fragment, not analysis."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":false,"category":"body","note":"Closing fragment of the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s18","text":"After the passing of Prohibition and many similar laws, people wanted them removed.","tags":{"task_development":{"match":true,"category":"efforts","note":"Opens the discussion of efforts to repeal Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the shift in opinion without analysis."},"document_use":{"match":false,"note":"General framing, not from a document."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":false,"note":"General framing rather than a specific fact."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the second paragraph (efforts to repeal)."},"inaccuracy":{"match":false}}},{"id":"2-s19","text":"According to document 4, many individuals \"attended meetings and gave speeches at rallies.\"","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect using Doc 4."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes the document without interpretation."},"document_use":{"match":true,"document":"doc4","note":"Quotation from Document 4 — repeal campaigners attended meetings and gave speeches at rallies. Check Doc 4 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 4."},"supporting_details":{"match":true,"note":"Specific document-based activity credited by the rater."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the repeal paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s20","text":"All of this was done in effort to repeal prohibition.","tags":{"task_development":{"match":true,"category":"efforts","note":"Clarifies that the activities were repeal efforts."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Restates the purpose without deeper analysis."},"document_use":{"match":false,"note":"The student's own framing."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":false,"note":"General statement rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the repeal paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s21","text":"In addition to this women raised funds and lobbied petitions to overturn prohibition.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — additional repeal tactics."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Lists actions without analysis."},"document_use":{"match":false,"note":"Doc 4 mentions raising funds, but the student presents it generally without citation."},"outside_information":{"match":false,"note":"No discrete outside fact credited by the rater."},"supporting_details":{"match":false,"note":"General rather than a specific credited detail."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the repeal paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s22","text":"In 2932 a mail in survey was conducted and an overwhelming number of people disagreed with prohibition.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — public opinion turning against Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports the survey without analysis."},"document_use":{"match":false,"note":"Lead-in to the Doc 3 quotation in the next sentence; the date here is mistyped (see Inaccuracies)."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":false,"note":"General lead-in; the specific figures follow."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the repeal paragraph."},"inaccuracy":{"match":true,"note":"Date error — the Literary Digest mail-in survey was conducted in 1932, not '2932.'"}}},{"id":"2-s23","text":"Document 3 states \"Residents of Ohio, the birth place of prohibition, sent 112,026 ballots for repeal and just 43,289 for keeping the ban on booze.\"","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with survey evidence from Doc 3."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes statistics without interpretation."},"document_use":{"match":true,"document":"doc3","note":"Quotation from Document 3 (Ohio repeal ballots). Check Doc 3 to verify. (Minor misquote: the document says 43,284, not 43,289.)"},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":true,"note":"Specific statistics credited by the rater (112,026 for repeal vs. ~43,284 to keep the ban)."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the repeal paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s24","text":"The vast majority of people wanted prohibition lifted.","tags":{"task_development":{"match":true,"category":"efforts","note":"Sums up the public's desire to repeal — develops the efforts aspect."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Restates the point of the survey without deeper analysis."},"document_use":{"match":false,"note":"The student's own summary."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":false,"note":"General statement rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Closing sentence of the repeal paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s25","text":"In the end the 18th Amendment regarding Prohibition was overturned.","tags":{"task_development":{"match":true,"category":"impact","note":"Opens the impact aspect — Prohibition was repealed."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the outcome without analysis."},"document_use":{"match":false,"note":"General statement, not tied to a specific document here."},"outside_information":{"match":false,"note":"No discrete outside fact."},"supporting_details":{"match":true,"note":"The rater credited 'in the end the 18th amendment overturned' as a supporting detail."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the final paragraph (impact)."},"inaccuracy":{"match":false}}},{"id":"2-s26","text":"The end of prohibition allowed us to see \"the demise of a moral crusade.\" (Doc 5)","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect using Doc 5."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes the document rather than analyzing it."},"document_use":{"match":true,"document":"doc5","note":"Quotation from Document 5 (Michael A. Lerner): the demise of a moral crusade. Check Doc 5 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 5."},"supporting_details":{"match":false,"note":"A quoted phrase rather than a concrete fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the final paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s27","text":"The failure of prohibition allowed Americans to see to what extent the government could control Social behavior and make it uniform.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — what Prohibition revealed about government power."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Closely paraphrases Doc 5's idea of a 'uniform standard of social behavior' rather than offering the student's own analysis."},"document_use":{"match":true,"document":"doc5","note":"Paraphrases Document 5 (imposing a uniform standard of social behavior). Check Doc 5 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 5."},"supporting_details":{"match":false,"note":"An interpretive paraphrase rather than a concrete fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the final paragraph."},"inaccuracy":{"match":false}}},{"id":"2-s28","text":"Prohibition revealed the limits of moral reform, prejudice, undemocratic ideals behind the government regulating social ideals.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the broader lesson of Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Very close paraphrase of Doc 5's closing line rather than the student's own analysis."},"document_use":{"match":true,"document":"doc5","note":"Paraphrases Document 5 (revealed the limits of moral reform and the paternalistic, prejudiced, undemocratic ideals of the dry crusade). Check Doc 5 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 5."},"supporting_details":{"match":false,"note":"A paraphrased conclusion rather than a concrete fact."},"organization":{"match":true,"category":"conclusion","note":"The essay's concluding sentence, as the rater noted."},"inaccuracy":{"match":false}}}]},{"id":"paper_a","letter":"B","score":3,"paragraphs":[6,8,4,1,5,3],"sentences":[{"id":"a-s01","text":"Throughout different historical periods in the United States, copious amounts of constitutional and civic dilemmas have constantly been raised by the American people.","tags":{"task_development":{"match":false,"note":"Opening generalization restating the prompt; no task aspect developed yet."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive framing."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"First sentence of the introduction (a restatement of the theme)."},"inaccuracy":{"match":false}}},{"id":"a-s02","text":"These issues resulted in individuals, groups, and governments all taking action to make change, some being more successful than others.","tags":{"task_development":{"match":false,"note":"General framing echoing the prompt."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive framing."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"Introduction sentence."},"inaccuracy":{"match":false}}},{"id":"a-s03","text":"One of these constitutional and civic issues has been Prohibition.","tags":{"task_development":{"match":false,"note":"Names the topic but develops no aspect yet."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the topic."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"No specific outside knowledge."},"supporting_details":{"match":false,"note":"No specific facts or details."},"organization":{"match":true,"category":"introduction","note":"Names the topic, completing the introduction."},"inaccuracy":{"match":false}}},{"id":"a-s04","text":"Prohibition initially began in the early 1800s when issues regarding the abuse of alcohol increased resulting in disastrous consequences that led to many people being placed in jails and poorhouses.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the social harm that gave rise to Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Narrates background without analysis."},"document_use":{"match":false,"note":"The jails-and-poorhouses idea appears in Doc 1, but the essay does not cite Doc 1; it reads as the student's own background."},"outside_information":{"match":false,"note":"Closely overlaps Doc 1's content, so not counted as outside knowledge."},"supporting_details":{"match":true,"note":"Specific consequence named — people placed in jails and poorhouses."},"organization":{"match":false,"category":"body","note":"Historical background in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s05","text":"Due to the unwell social state that many people were in, temperance groups formed and persuaded many people that drinking was wrong.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the rise of temperance groups."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes the temperance response without analysis."},"document_use":{"match":false,"note":"Not tied to a specific document."},"outside_information":{"match":false,"note":"General background rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"General rather than a specific named fact."},"organization":{"match":false,"category":"body","note":"Historical background in the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s06","text":"Ultimately the government decided to pass laws making it so that the sale of alcohol would end.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Closes the historical-circumstances paragraph — the move to ban alcohol."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the outcome without analysis."},"document_use":{"match":false,"note":"General statement, not from a document."},"outside_information":{"match":false,"note":"General rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"General rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Closing sentence of the opening paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s07","text":"The efforts to address Prohibition were widely seen coming from individuals.","tags":{"task_development":{"match":true,"category":"efforts","note":"Topic sentence introducing the efforts aspect (individuals/the democratic process)."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Framing statement for the paragraph."},"document_use":{"match":false,"note":"No specific document information."},"outside_information":{"match":false,"note":"Framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No concrete detail yet."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s08","text":"In Document 2, their efforts were represented through the democratic system of voting, as people got to voice their opinions both directly and indirectly.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect using Doc 2."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports the document without deeper analysis."},"document_use":{"match":true,"document":"doc2","note":"Uses Document 2 (state ratification of the Prohibition amendment as a democratic act). Check Doc 2 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 2."},"supporting_details":{"match":false,"note":"A general point about voting rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s09","text":"State legislators, democratically elected by the people, had to ratify the National Prohibition Amendment.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — the ratification process."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Explains the process without analysis."},"document_use":{"match":false,"note":"The civics of ratification is the student's own knowledge, not document text."},"outside_information":{"match":true,"note":"Outside information — how amendments are ratified (democratically elected state legislators) is knowledge from outside the six documents."},"supporting_details":{"match":false,"note":"Process knowledge rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s10","text":"Since only 4 states had not ratified by January 1919, it seemed that many people supported a ban on alcohol.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with evidence of broad support."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"Draws an inference from the data ('it seemed that many people supported a ban')."},"document_use":{"match":true,"document":"doc2","note":"Uses Document 2's fact that only 4 states had not ratified by January 1919. Check Doc 2 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 2."},"supporting_details":{"match":true,"note":"Specific statistic — only 4 states unratified by January 1919."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s11","text":"State legislators might have also been persuaded by the moral and religious arguments of individuals in the Anti-Saloon League who supported Prohibition.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — the Anti-Saloon League's influence."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"Reasons about why legislators may have acted ('might have also been persuaded by...') — an interpretive move."},"document_use":{"match":false,"note":"The moral/religious motive echoes Doc 2 but is offered here as the student's own speculation rather than a citation."},"outside_information":{"match":false,"note":"Speculation rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"Speculative claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s12","text":"In Document 3 people voicing their opinion is seen through a mail-in-survey, in The Literary Digest.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect using Doc 3."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports the document without analysis."},"document_use":{"match":true,"document":"doc3","note":"Uses Document 3 (the Literary Digest mail-in survey). Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":false,"note":"Names the survey; the specific figure comes in the next sentence."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s13","text":"During this time many were disagreeing with Hoover's Five and Ten Law and federal enforcement and they decided to take action by responding to a survey, in which 112,026 voted for repeal.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with survey evidence."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports the figures without analysis."},"document_use":{"match":true,"document":"doc3","note":"Uses Document 3 (112,026 ballots for repeal; opposition to Hoover's enforcement). Check Doc 3 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 3."},"supporting_details":{"match":true,"note":"Specific statistic — 112,026 voted for repeal."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s14","text":"From this it is made entirely evident that people started to see the problems with Prohibition, and decided to make their opinions known.","tags":{"task_development":{"match":true,"category":"efforts","note":"Draws the paragraph's efforts together with a conclusion."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"An analytical conclusion ('it is made entirely evident that people started to see the problems')."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An interpretive conclusion rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Closing sentence of the efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s15","text":"Aside from the people in general making efforts to address Prohibition more specific groups such as women decided to take action as well.","tags":{"task_development":{"match":true,"category":"efforts","note":"Topic sentence introducing a second effort (women/the WONPR)."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Framing statement for the paragraph."},"document_use":{"match":false,"note":"No specific document information."},"outside_information":{"match":false,"note":"Framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No concrete detail yet."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the second efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s16","text":"In Document 4, an example of this is represented through the creation of the organization WONPR (Women's Organization for National Prohibition Reform.)","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect using Doc 4."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports the document without analysis."},"document_use":{"match":true,"document":"doc4","note":"Uses Document 4 (the founding of the WONPR). Check Doc 4 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 4."},"supporting_details":{"match":true,"note":"Names a specific organization with its full title (the WONPR)."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the second efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s17","text":"This organization worked to repeal Prohibition from the view point of the \"new women\".","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect — the WONPR's repeal goal."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the goal without analysis."},"document_use":{"match":true,"document":"doc4","note":"Uses Document 4 (the WONPR and the 'new woman' of the 1920s). Check Doc 4 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 4."},"supporting_details":{"match":false,"note":"A general statement of the group's aim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the second efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s18","text":"They strongly believed that it only created more issues as it led to distrust and more underage drinking, and they actively worked to recruit more people and gain publicity through events.","tags":{"task_development":{"match":true,"category":"efforts","note":"Develops the efforts aspect with the WONPR's beliefs and activities."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Lists beliefs and activities without analysis."},"document_use":{"match":true,"document":"doc4","note":"Uses Document 4 (the WONPR believed Prohibition caused distrust and underage drinking; recruited members and held events). Check Doc 4 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 4."},"supporting_details":{"match":true,"note":"Specific WONPR motives and tactics — distrust, underage drinking, recruiting, publicity events."},"organization":{"match":false,"category":"body","note":"Closing sentence of the second efforts paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s19","text":"The courses of action taken by the people were successful in that the 18th Amendment was passed and later proved to be successful as Prohibition was eventually repealed.","tags":{"task_development":{"match":true,"category":"impact","note":"Introduces the impact aspect — the outcomes of these efforts."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States the outcomes without deeper analysis."},"document_use":{"match":false,"note":"General statement, not tied to a specific document."},"outside_information":{"match":false,"note":"General rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"General outcome rather than a specific fact."},"organization":{"match":true,"category":"body","note":"A short transitional paragraph bridging efforts and impact."},"inaccuracy":{"match":false}}},{"id":"a-s20","text":"It was made entirely evident that these efforts were successful and represented the shifting viewpoints of the people.","tags":{"task_development":{"match":true,"category":"impact","note":"Topic sentence of the impact paragraph."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"An evaluative claim that the efforts succeeded and reflected shifting public viewpoints."},"document_use":{"match":false,"note":"The student's own evaluation."},"outside_information":{"match":false,"note":"An evaluation rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An evaluative claim rather than a specific fact."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s21","text":"In Document 5, it is clearly stated by Michael A Lerner that the act of Prohibition was unsuccessful both in changing Americans people's behaviors and putting an end to substance abuse.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect using Doc 5's verdict."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports the document's conclusion."},"document_use":{"match":true,"document":"doc5","note":"Uses Document 5 (Michael A. Lerner: Prohibition changed neither behavior nor the problems of alcohol abuse). Check Doc 5 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 5."},"supporting_details":{"match":false,"note":"A quoted conclusion rather than a concrete fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s22","text":"It was gradually deemed as a complete failure as it was supported by fewer and fewer people.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — declining support."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Restates the failure point without deeper analysis."},"document_use":{"match":false,"note":"The student's own framing."},"outside_information":{"match":false,"note":"General rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"General rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s23","text":"The efforts taken by groups such as the WONPR, as previously stated, directly contributed to this matter as it shined more light on the fact that although Prohibition was achieved through democratic methods, in the end it was seen as undemocratic and was repealed by the efforts taken by the American people speaking out against it.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — connecting the WONPR's work to repeal."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"Strong analysis — Prohibition was achieved democratically yet came to be seen as undemocratic and was overturned by popular effort."},"document_use":{"match":false,"note":"The student's own synthesis."},"outside_information":{"match":false,"note":"Analysis rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An analytical claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the impact paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s24","text":"It is evident that the democratic system puts more power at the hands of the people.","tags":{"task_development":{"match":false,"note":"A broad closing reflection rather than development of a task aspect."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"A concluding generalization drawn from the discussion (democracy empowers the people)."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A general conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":true,"category":"conclusion","note":"A concluding-type statement summing up the essay's democratic theme."},"inaccuracy":{"match":false}}},{"id":"a-s25","text":"In Document 6, we are given a prime example of what the people through their efforts achieved in a primary source.","tags":{"task_development":{"match":true,"category":"impact","note":"Introduces Doc 6 as evidence of the impact of the people's efforts."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Frames the document without analysis."},"document_use":{"match":true,"document":"doc6","note":"Cites Document 6 (the New York Times front page on repeal). Check Doc 6 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 6."},"supporting_details":{"match":false,"note":"A framing reference rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Topic sentence of the final paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s26","text":"The source is a newspaper article informing people of the ratification of the Prohibition repeal and explains President Roosevelt's opinions on it.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect — the repeal as reported in Doc 6."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes the document."},"document_use":{"match":true,"document":"doc6","note":"Uses Document 6 (newspaper announcing repeal and Roosevelt's response). Check Doc 6 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 6."},"supporting_details":{"match":false,"note":"Describes the source rather than citing a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the final paragraph."},"inaccuracy":{"match":false}}},{"id":"a-s27","text":"It ultimately states that although he supported it, the repeal celebration was done with \"restraint\" as many speakeasies were closed and liquor was scarce.","tags":{"task_development":{"match":true,"category":"impact","note":"Develops the impact aspect with specific details of the repeal."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports specifics from the document without analysis."},"document_use":{"match":true,"document":"doc6","note":"Uses Document 6 (celebration with restraint; speakeasies closed; legal liquor scarce). Check Doc 6 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 6."},"supporting_details":{"match":true,"note":"Concrete details — restraint, speakeasies closing, liquor scarce."},"organization":{"match":false,"category":"body","note":"Closing sentence of the final paragraph."},"inaccuracy":{"match":false}}}]},{"id":"level_5","letter":"C","score":5,"paragraphs":[4,12,16,8],"sentences":[{"id":"5-s01","text":"Alcohol consumption has existed all over the world for thousands of years and in the United States since colonization.","tags":{"task_development":{"match":false,"note":"Broad opening context; the task aspects are developed in the body."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Descriptive background statement."},"document_use":{"match":false,"note":"Not from any document."},"outside_information":{"match":true,"note":"The rater credited 'alcohol consumption existed all over the world for thousands of years' as outside information."},"supporting_details":{"match":true,"note":"The rater also credited 'alcohol consumption an issue in the United States since colonization' as a supporting detail. (A dense opener — it does both.)"},"organization":{"match":true,"category":"introduction","note":"Opening sentence of the introduction."},"inaccuracy":{"match":false}}},{"id":"5-s02","text":"Alongside it, alcohol has also brought its problems.","tags":{"task_development":{"match":false,"note":"Framing sentence in the introduction."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"General framing."},"document_use":{"match":false,"note":"No document information."},"outside_information":{"match":false,"note":"General framing rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"No specific fact."},"organization":{"match":true,"category":"introduction","note":"Introduction sentence."},"inaccuracy":{"match":false}}},{"id":"5-s03","text":"In America the issue of Prohibition proved to be one of the most significant debates in history.","tags":{"task_development":{"match":false,"note":"Thesis framing in the introduction."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this evaluation (Prohibition was one of the most significant debates in history) as analytical."},"document_use":{"match":false,"note":"The student's own thesis."},"outside_information":{"match":false,"note":"A thesis claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A thesis statement rather than a concrete fact."},"organization":{"match":true,"category":"introduction","note":"Thesis sentence of an introduction that goes beyond a restatement of the theme."},"inaccuracy":{"match":false}}},{"id":"5-s04","text":"It was so much so that a Prohibition amendment was ratified and afterwards continued to be a constitutional and civic issue for more than a decade.","tags":{"task_development":{"match":false,"note":"Thesis framing previewing the long arc of the issue."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this (the amendment was ratified yet remained a constitutional/civic issue for more than a decade) as analytical."},"document_use":{"match":false,"note":"The student's own framing."},"outside_information":{"match":false,"note":"A framing claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A thesis statement rather than a concrete fact."},"organization":{"match":true,"category":"introduction","note":"Closing thesis sentence of the introduction."},"inaccuracy":{"match":false}}},{"id":"5-s05","text":"In Document 1 it discusses how there was an influx of commerce and increase in consumption in regards to alcohol after the war of 1812.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Opens the historical-circumstances aspect using Doc 1."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Reports document content without interpretation."},"document_use":{"match":true,"document":"doc1","note":"Paraphrases Document 1 (rise in commerce and consumption after the War of 1812). Check Doc 1 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 1."},"supporting_details":{"match":true,"note":"The rater credited 'after the War of 1812, influx in commerce and increase in consumption' as a supporting detail."},"organization":{"match":true,"category":"body","note":"Topic sentence opening the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s06","text":"It is also mentioned how the Prohibition movement was \"an outgrowth of the temperance crusades of the first half of the 19th century\" which initially stressed abstinence and rehabilitation.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the temperance origins of Prohibition."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Quotes the document and adds a descriptive detail."},"document_use":{"match":true,"document":"doc1","note":"Direct quotation from Document 1 (Prohibition as an outgrowth of the temperance crusades). Check Doc 1 to verify."},"outside_information":{"match":true,"note":"The added detail that the crusades 'initially stressed abstinence and rehabilitation' is outside information the rater credited."},"supporting_details":{"match":true,"note":"The rater also credited 'Prohibition movement an outgrowth of the temperance crusades' as a supporting detail. (This sentence quotes a document, adds outside knowledge, AND states a credited detail.)"},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s07","text":"However, the effects of alcohol proved to have extremely negative consequences.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the harm caused by alcohol."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this evaluation (the effects of alcohol proved to have extremely negative consequences) as analytical."},"document_use":{"match":false,"note":"The student's own evaluation."},"outside_information":{"match":false,"note":"An evaluative claim rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"A general claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s08","text":"This led to many women and mothers in the first half of the 19th century coming together to organize the temperance movements as many families had to deal with awful behavior due to husbands and fathers frequently being under the influence of alcohol.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — why women organized the temperance movement."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Narrates the rise of the women's temperance movement."},"document_use":{"match":false,"note":"Not in any document — the student's own knowledge."},"outside_information":{"match":true,"note":"The rater credited this as outside information: women and mothers organized temperance movements because families faced awful behavior from husbands and fathers under the influence of alcohol."},"supporting_details":{"match":false,"note":"Counted by the rater as outside information."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s09","text":"Their work also led to local and state governments passing \"wet and dry acts\".","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — early local/state laws."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"States a development without analysis."},"document_use":{"match":false,"note":"Not from a document — the student's own knowledge."},"outside_information":{"match":false,"note":"Outside the documents, but not among the items the rater enumerated as the essay's outside information."},"supporting_details":{"match":false,"note":"General rather than a specifically credited fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s10","text":"Those who were associated with the \"wet\" were against the ban of alcohol while those for dry insisted on it being illegal.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — defines the wet/dry divide."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Defines the two sides without analysis."},"document_use":{"match":false,"note":"The student's own explanation."},"outside_information":{"match":false,"note":"An explanation of terms rather than a discrete credited outside fact."},"supporting_details":{"match":false,"note":"A definition rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s11","text":"This proved to cause a rift between the two in many parts of the country.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the national divide over alcohol."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited the conclusion that the wet/dry divide caused a rift in many parts of the country as analytical."},"document_use":{"match":false,"note":"The student's own conclusion."},"outside_information":{"match":false,"note":"A conclusion rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An analytical claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s12","text":"In document 2, a poster displays a map that shows how support for Prohibition had taken over the country and was heading toward National Ratification of a Prohibition Amendment.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances using Doc 2."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes the document's map without interpretation."},"document_use":{"match":true,"document":"doc2","note":"Uses Document 2 (the Anti-Saloon League ratification map). Check Doc 2 to verify."},"outside_information":{"match":false,"note":"Drawn from Document 2."},"supporting_details":{"match":false,"note":"Describes the document rather than citing a specific credited fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s13","text":"The work of groups such as the Women's Christian Temperance Union and Anti-Saloon League supported a ban on alcohol for both moral and religious reasons and had been influenced by the Second Great Awakening.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the moral/religious roots of the movement."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Describes the groups' motivations."},"document_use":{"match":false,"note":"The groups appear in Docs 2 and 4, but the synthesis (and the Second Great Awakening) is the student's own knowledge; the rater credited this as outside information."},"outside_information":{"match":true,"note":"The rater credited this as outside information: the WCTU and Anti-Saloon League supported a ban for moral and religious reasons, influenced by the Second Great Awakening."},"supporting_details":{"match":false,"note":"Counted by the rater as outside information."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s14","text":"This and Progressivism led to much interest in social reform by the early 20th century.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — Prohibition within the Progressive reform era."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Connects to Progressivism as background rather than developed analysis."},"document_use":{"match":false,"note":"The student's own knowledge."},"outside_information":{"match":false,"note":"Background reference rather than one of the rater's enumerated outside-information items."},"supporting_details":{"match":false,"note":"A general connection rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s15","text":"As time passed and anti-liquor forces lobbied and became politically more powerful, ideas shifted and led to more people believing that the federal government had the responsibility to ban alcohol nationally.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — the shift toward national prohibition."},"analytical_vs_descriptive":{"match":true,"category":"analytical","note":"The rater credited this cause-and-effect (as anti-liquor forces grew more powerful, ideas shifted toward federal responsibility to ban alcohol) as analytical."},"document_use":{"match":false,"note":"The student's own analysis."},"outside_information":{"match":false,"note":"Analysis rather than a discrete outside fact."},"supporting_details":{"match":false,"note":"An analytical claim rather than a specific fact."},"organization":{"match":false,"category":"body","note":"Supporting sentence in the historical-circumstances paragraph."},"inaccuracy":{"match":false}}},{"id":"5-s16","text":"With the United States fighting Germany in World War I, the connection German Americans had with making and drinking beer made Prohibition a nativist and patriotic issue that increased support for Prohibition.","tags":{"task_development":{"match":true,"category":"historical_circumstances","note":"Develops historical circumstances — WWI nativism boosting Prohibition support."},"analytical_vs_descriptive":{"match":false,"category":"descriptive","note":"Presents the WWI connection as historical background."},"document_use":{"match":false,"note":"Not i
