<style>

.q{background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:14px 0}

.fb.no{background:var(--tint-bad);border-left-color:var(--bad)}
.fb .v{font-weight:700}
.tagline{display:inline-block;margin-top:6px;font-size:.85rem;color:var(--text-muted)}

label.fl{display:block;font-weight:600;margin:14px 0 4px}
.starter{color:var(--text-muted);font-size:.92rem;margin:0 0 4px}
textarea{width:100%;min-height:110px;background:var(--bg-inset);color:var(--text-primary);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;resize:vertical;overflow:visible}
.exportbar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px}
.notice{background:var(--bg-inset);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin:14px 0}

.gloss{border-bottom:1px dotted var(--accent);cursor:help;position:relative}
.gloss:hover::after,.gloss:focus::after{
  content:attr(data-def);position:absolute;left:0;bottom:calc(100% + 6px);z-index:20;

}

.foot{margin-top:16px;color:var(--text-muted);font-size:.85rem;text-align:center}

.modal{position:fixed;inset:0;z-index:50;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:16px}

.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px}
.err{color:var(--bad);min-height:1.4em;margin:6px 0 0}

#printArea{display:none}

@media print{
  @page{margin:.7in}
  body{background:var(--print-paper);color:var(--print-ink);font-size:12pt}

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var LS_KEY='edsim_fedstate_power_v1';
var TAB_COUNT=5;
function x(e,s){return {e:e,s:s};}
function $(id){return document.getElementById(id);}

/* ---------- content ---------- */
var TABS=[
  {label:'Directions',sub:'Start here'},
  {label:'Round 1',sub:'Name That Power'},
  {label:'Round 2',sub:'When Laws Collide'},
  {label:'Round 3',sub:'Trace the Rule'},
  {label:'Reflect & Export',sub:'Wrap up'}
];

var COLS=[
  {key:'delegated',label:'Delegated',def:x('Powers the Constitution gives to the federal government.','Powers the Constitution gives the federal government.')},
  {key:'reserved',label:'Reserved',def:x('Powers kept by the states (10th Amendment).','Powers left to the states.')},
  {key:'concurrent',label:'Concurrent',def:x('Powers both levels share.','Powers both share.')}
];

var CARDS=[
 {id:'d1',ans:'delegated',text:x('Coining and printing money','Making the nation’s money'),
  src:x('Article I, Section 8 gives Congress the power to coin money. States are barred from doing it (Article I, Section 10).','The Constitution says Congress makes money. States are not allowed to.')},
 {id:'d2',ans:'delegated',text:x('Declaring war','Deciding to go to war'),
  src:x('Article I, Section 8 gives Congress the power to declare war.','The Constitution gives this job to Congress.')},
 {id:'d3',ans:'delegated',text:x('Negotiating treaties with other countries','Making agreements with other countries'),
  src:x('Article II, Section 2: the president negotiates treaties and the Senate approves them. States cannot make treaties (Article I, Section 10).','The president makes the deal and the Senate must approve it. States can’t do this.')},
 {id:'d4',ans:'delegated',text:x('Regulating trade between states','Making rules for trade between states'),
  src:x('The Commerce Clause (Article I, Section 8) gives Congress this power.','The Commerce Clause gives Congress this job.')},
 {id:'d5',ans:'delegated',text:x('Running the postal service','Running the post office'),
  src:x('Article I, Section 8 gives Congress the power to establish post offices.','The Constitution names post offices as a job for Congress.')},
 {id:'d6',ans:'delegated',text:x('Setting the rules for becoming a citizen','Deciding how a person can become a citizen'),
  src:x('Article I, Section 8 gives Congress the power to set one uniform rule of naturalization.','Congress sets one set of rules for the whole country. This process is called naturalization.')},
 {id:'r1',ans:'reserved',text:x('Issuing driver’s licenses','Giving out driver’s licenses'),
  src:x('The Constitution doesn’t list this power, so the 10th Amendment leaves it to the states.','The Constitution does not list this job, so the 10th Amendment leaves it to the states.')},
 {id:'r2',ans:'reserved',text:x('Setting up and running public school districts','Running public schools'),
  src:x('Education isn’t listed in the Constitution, so it falls to the states under the 10th Amendment. Federal rules still apply on top (see Round 3).','Schools are not listed for the federal government, so states run them. Federal rules still add some limits (see Round 3).')},
 {id:'r3',ans:'reserved',text:x('Creating local police departments','Setting up local police'),
  src:x('Protecting public safety is part of the states’ police power under the 10th Amendment.','Public safety is a state job. This is called the police power.')},
 {id:'r4',ans:'reserved',text:x('Issuing marriage licenses','Giving out marriage licenses'),
  src:x('Not listed in the Constitution, so states handle it. They must still follow the Constitution’s guarantees, such as equal protection.','States do this job, but they must still follow the rights in the Constitution, such as equal protection.')},
 {id:'r5',ans:'reserved',text:x('Licensing professionals such as teachers, nurses, and barbers','Giving licenses to teachers, nurses, and barbers'),
  src:x('States protect public health and safety through the police power (10th Amendment).','States protect health and safety, so they decide who gets a license.')},
 {id:'r6',ans:'reserved',text:x('Deciding local zoning and land use','Deciding what can be built where in a town'),
  src:x('Land-use rules come from state power, which states pass down to towns and counties.','This is a state power that states let towns use. The rules are called zoning.')},
 {id:'c1',ans:'concurrent',text:x('Collecting taxes','Collecting taxes'),
  src:x('Congress can tax (Article I, Section 8), and states keep their own taxing power too (10th Amendment). Both levels do it.','The federal government and the states both collect taxes.')},
 {id:'c2',ans:'concurrent',text:x('Building and maintaining highways','Building and fixing highways'),
  src:x('The federal government funds and builds interstate highways. States build and maintain their own roads as well.','The federal government and the states both build roads.')},
 {id:'c3',ans:'concurrent',text:x('Running court systems','Running courts'),
  src:x('Article III creates federal courts, and each state constitution creates state courts.','There are federal courts and state courts.')},
 {id:'c4',ans:'concurrent',text:x('Writing and enforcing criminal laws','Making and enforcing criminal laws'),
  src:x('Congress can create federal crimes, and states make and enforce their own criminal laws.','There are federal crimes and state crimes.')},
 {id:'c5',ans:'concurrent',text:x('Borrowing money','Borrowing money'),
  src:x('Congress can borrow money (Article I, Section 8), and states can borrow too.','Both levels of government can borrow money.')},
 {id:'c6',ans:'concurrent',text:x('Chartering banks','Allowing banks to open'),
  src:x('Congress created national banks (McCulloch v. Maryland), and states charter their own banks.','There are national banks and state banks.')}
];

var R1_INTRO=x('Every government power falls into one of three groups. Sort each card into the group where it belongs. A card only stays if you place it correctly, and the card then shows you where the power comes from.','Every government power fits one of three groups. Sort each card into its group. If you are right, the card stays and shows where the power comes from.');
var R1_HOW=x('Tap or click a card, then choose “Place selected card here” under a column. You can also drag a card into a column.','Tap or click a card. Then press “Place selected card here” under a column. You can also drag a card.');
var R1_MISS=x('Not quite. Use the test: Is the power listed in the Constitution for the federal government? Do both levels do it? If it isn’t listed for the federal government and isn’t denied to the states, think 10th Amendment. The card is back in the pool.','Not quite. Ask: Does the Constitution list it for the federal government? Do both levels do it? If not listed, the 10th Amendment gives it to the states. The card is back in the pool.');
var R1_DONE=x('Key idea: if the Constitution lists a power for the federal government, it is delegated. If it is not listed and not denied to the states, the 10th Amendment reserves it to the states. Many everyday powers, like taxing and building roads, are concurrent.','Key idea: if the Constitution lists it for the federal government, it is delegated. If not, the 10th Amendment leaves it to the states (reserved). Some powers, like taxing, are shared (concurrent).');

var R2_INTRO=x('The Supremacy Clause (Article VI) says the Constitution and federal laws are “the supreme law of the land.” That matters when a state law and a federal law collide. Read each scenario and choose which law controls. Watch for cases where the answer is not what you expect.','The Supremacy Clause (Article VI) says federal law is the highest law of the land. That matters when a state law and a federal law collide. Read each scenario and pick who controls. Some answers may surprise you.');
var FED='fed',STA='sta';
var R2=[
 {id:'q1',stem:x('Maryland puts a tax on the Second Bank of the United States, a federal institution. Which law controls?','Maryland taxes the national bank. Which law controls?'),
  opts:[{id:FED,t:x('Federal law controls','Federal law controls')},{id:STA,t:x('State law controls','State law controls')}],correct:FED,
  why:x('Federal. In McCulloch v. Maryland (1819), the Supreme Court ruled that a state cannot tax or block a valid federal institution. The Supremacy Clause makes federal law the supreme law of the land.','Federal law controls. This is McCulloch v. Maryland (1819). The Supremacy Clause makes federal law the highest law, so a state can’t block a federal bank.')},
 {id:'q2',stem:x('New York gives one company a monopoly on steamboat travel in its waters, but a competitor holds a federal license to operate there. Which law controls?','A state gives one company the only right to run steamboats. Another company has a federal license. Which law controls?'),
  opts:[{id:FED,t:x('Federal law controls','Federal law controls')},{id:STA,t:x('State law controls','State law controls')}],correct:FED,
  why:x('Federal. Gibbons v. Ogden (1824) held that Congress’s power to regulate interstate commerce overrides a conflicting state law.','Federal law controls. This is Gibbons v. Ogden (1824). Congress controls trade between states, so it beats a conflicting state law.')},
 {id:'q3',stem:x('After the Supreme Court orders schools desegregated, Arkansas officials say they don’t have to obey. Which law controls?','The Supreme Court orders schools to desegregate. Arkansas says it doesn’t have to follow the ruling. Which law controls?'),

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

    if(seen[k])return m;
    seen[k]=1;
    var d=GLOSS[k];
    return '<span class="gloss" tabindex="0" role="note" data-def="'+esc(d)+'" aria-label="'+esc(m+': '+d)+'">'+esc(m)+'</span>';
  });
}

function defaultState(){
  return {v:1,tier:'standard',cardOrder:shuffle(CARDS.map(function(c){return c.id;})),place:{},misses:{},r2:{},r3:{},reflect:{}};
}
function validate(s){
  if(!s||s.v!==1)return null;
  var ids=CARDS.map(function(c){return c.id;});
  if(!Array.isArray(s.cardOrder)||s.cardOrder.length!==ids.length)return null;
  for(var i=0;i<ids.length;i++){if(s.cardOrder.indexOf(ids[i])<0)return null;}
  var out=defaultState();
  out.cardOrder=s.cardOrder.slice();
  out.tier=s.tier==='simple'?'simple':'standard';
  var colKeys=COLS.map(function(c){return c.key;});
  Object.keys(s.place||{}).forEach(function(id){if(CBY[id]&&colKeys.indexOf(s.place[id])>-1)out.place[id]=s.place[id];});
  Object.keys(s.misses||{}).forEach(function(id){if(CBY[id]&&s.misses[id]===true)out.misses[id]=true;});
  R2.forEach(function(q){var v=(s.r2||{})[q.id];if(v&&q.opts.some(function(o){return o.id===v;}))out.r2[q.id]=v;});
  R3.forEach(function(q){var v=(s.r3||{})[q.id];if(v&&R3_OPTS.some(function(o){return o.id===v;}))out.r3[q.id]=v;});
  var rk=['r3own'].concat(REFLECT.map(function(r){return r.id;}));
  rk.forEach(function(k){var v=(s.reflect||{})[k];if(typeof v==='string')out.reflect[k]=v.slice(0,5000);});
  return out;
}

/* ---------- tabs ---------- */
function buildTabs(){
  var nav=$('tabs');nav.innerHTML='';
  TABS.forEach(function(t,i){
    var b=document.createElement('button');
    b.type='button';b.className='tab';b.id='tab-'+i;b.setAttribute('role','tab');
    b.setAttribute('aria-controls','panel-'+i);
    b.innerHTML='<span class="lbl">'+esc(t.label)+'</span><small>'+esc(t.sub)+'</small>';
    b.addEventListener('click',function(){showTab(i);});
    b.addEventListener('keydown',function(e){
      var n=null;
      if(e.key==='ArrowRight')n=(i+1)%TAB_COUNT;
      else if(e.key==='ArrowLeft')n=(i+TAB_COUNT-1)%TAB_COUNT;
      else if(e.key==='Home')n=0;
      else if(e.key==='End')n=TAB_COUNT-1;
      if(n!==null){e.preventDefault();showTab(n);$('tab-'+n).focus();}
    });
    nav.appendChild(b);
  });
  for(var i=0;i<TAB_COUNT;i++){
    var pn=document.querySelector('#panel-'+i+' .pnav');
    pn.innerHTML='';
    var prev=document.createElement('button');
    prev.type='button';prev.className='btn';prev.textContent='← Previous';
    if(i===0){prev.style.visibility='hidden';prev.setAttribute('aria-hidden','true');prev.tabIndex=-1;}
    else prev.addEventListener('click',(function(k){return function(){showTab(k-1);};})(i));
    var next=document.createElement('button');
    next.type='button';next.className='btn primary';next.textContent='Next →';
    if(i===TAB_COUNT-1){next.style.visibility='hidden';next.setAttribute('aria-hidden','true');next.tabIndex=-1;}
    else next.addEventListener('click',(function(k){return function(){showTab(k+1);};})(i));
    pn.appendChild(prev);pn.appendChild(next);
  }
}
function showTab(i){
  currentTab=i;
  for(var k=0;k<TAB_COUNT;k++){
    $('panel-'+k).hidden=(k!==i);
    var t=$('tab-'+k);
    t.setAttribute('aria-selected',k===i?'true':'false');
    t.tabIndex=(k===i)?0:-1;
  }
  window.scrollTo(0,0);
}

        if(o.id===chosen)cls+=' chosen';
      }
      h+='<button type="button" class="'+cls+'" data-q="'+it.id+'" data-o="'+o.id+'" aria-pressed="'+(chosen===o.id?'true':'false')+'"'+(chosen?' aria-disabled="true"':'')+'>'+plain(o.t)+'</button>';
    });
    h+='</div>';
    if(chosen){
      var ok=chosen===it.correct;
      h+='<div class="fb '+(ok?'ok':'no')+'" role="status"><span class="v">'+(ok?'Correct. ':'Not quite. ')+'</span>'+R(it.why);
      if(it.label)h+='<br><span class="tagline">'+plain(it.label)+'</span>';
      h+='</div>';
    }
    h+='</div>';
  });
  return h;
}
function bindMC(host,store,onChange){
  host.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(){
      var q=b.getAttribute('data-q');
      if(store[q])return;
      store[q]=b.getAttribute('data-o');
      save();
      onChange();
      updateTabs();
      var again=host.querySelector('.opt[data-q="'+q+'"][data-o="'+store[q]+'"]');
      if(again)again.focus();
    });
  });
}
function renderR2(){
  var host=$('body-2');
  var sc=mcScore(R2,state.r2);
  var h='<h2>Round 2: When Laws Collide</h2><p class="lede">'+R(R2_INTRO)+'</p>';
  h+='<div class="scorebar">Answered '+sc.answered+' of '+R2.length+' &middot; Correct: '+sc.correct+'</div>';
  h+=mcHTML(R2,state.r2,null,'Scenario');
  host.innerHTML=h;
  bindMC(host,state.r2,renderR2);
}
function renderR3(){
  var host=$('body-3');
  var sc=mcScore(R3,state.r3);
  var h='<h2>Round 3: Trace the Rule</h2><p class="lede">'+R(R3_INTRO)+'</p>';
  h+='<div class="scorebar">Answered '+sc.answered+' of '+R3.length+' &middot; Correct: '+sc.correct+'</div>';
  h+='<p class="muted">Question for each rule: who is really behind it?</p>';
  h+=mcHTML(R3,state.r3,R3_OPTS,'Rule');
  h+='<h3>Find your own</h3>';
  h+='<label class="fl" for="ta-r3own">'+R(R3_OWN)+'</label>';
  if(state.tier==='simple')h+='<p class="starter">Sentence starter: '+esc(R3_OWN_STARTER)+'</p>';
  h+='<textarea id="ta-r3own" aria-label="Your own example of a rule"></textarea>';
  host.innerHTML=h;
  bindMC(host,state.r3,renderR3);
  bindTA('ta-r3own','r3own');
}

/* ---------- reflection + export ---------- */
function bindTA(domId,key){
  var ta=$(domId);if(!ta)return;
  ta.value=state.reflect[key]||'';
  ta.addEventListener('input',function(){state.reflect[key]=ta.value;save();updateTabs();});
}
function renderReflect(){
  var host=$('body-4');
  var h='<h2>Reflect &amp; Export</h2><p class="lede">Answer each question in a few sentences. Your answers save as you type.</p>';
  REFLECT.forEach(function(r,i){
    h+='<label class="fl" for="ta-'+r.id+'">'+(i+1)+'. '+esc(r.head)+': '+esc(r.q)+'</label>';
    if(state.tier==='simple')h+='<p class="starter">Sentence starter: '+esc(r.starter)+'</p>';
    h+='<textarea id="ta-'+r.id+'"></textarea>';
  });
  h+='<div class="notice"><strong>Before you export:</strong> once you confirm your download or copy worked, this page will clear for the next student. Nothing is deleted until you confirm it saved.</div>';
  h+='<div class="exportbar"><button type="button" class="btn primary" id="openExport">Export my work&hellip;</button></div>';
  h+='<p class="muted">You can export in more than one sitting. Choose only the sections you have finished, then export the rest next time.</p>';
  host.innerHTML=h;
  REFLECT.forEach(function(r){bindTA('ta-'+r.id,r.id);});
  $('openExport').addEventListener('click',openExport);
}

/* ---------- export ---------- */
var SECTIONS=[
  {id:'r1',label:'Round 1: Name That Power'},
  {id:'r2',label:'Round 2: When Laws Collide'},
  {id:'r3',label:'Round 3: Trace the Rule'},
  {id:'ref',label:'Reflection answers'}
];
var lastFocus=null;
function openModal(id){lastFocus=document.activeElement;var m=$(id);m.classList.add('active');var b=m.querySelector('button');if(b)b.focus();}
function closeModal(id){$(id).classList.remove('active');if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}}
function openExport(){
  $('exportChecks').innerHTML=SECTIONS.map(function(s){
    return '<label class="chk"><input type="checkbox" value="'+s.id+'" checked> '+esc(s.label)+'</label>';
  }).join('');
  $('exportErr').textContent='';
  openModal('exportModal');
}
function selectedSections(){
  var out=[];
  $('exportChecks').querySelectorAll('input:checked').forEach(function(i){out.push(i.value);});
  return out;
}
function optText(list,id){var o=list.filter(function(x){return x.id===id;})[0];return o?T(o.t):'';}
function buildSections(ids){
  var out=[];
  ids.forEach(function(id){
    var L=[];
    if(id==='r1'){
      var firstTry=CARDS.filter(function(c){return state.place[c.id]&&!state.misses[c.id];}).length;
      L.push({k:'p',t:'Cards placed: '+Object.keys(state.place).length+' of '+CARDS.length+'. Correct on the first try: '+firstTry+'.'});
      COLS.forEach(function(col){
        L.push({k:'h',t:col.label+' powers'});
        var any=false;
        Object.keys(state.place).forEach(function(cid){if(state.place[cid]===col.key){any=true;L.push({k:'li',t:T(CBY[cid].text)});}});
        if(!any)L.push({k:'li',t:'(none placed)'});
      });
      var left=CARDS.filter(function(c){return !state.place[c.id];});
      if(left.length){L.push({k:'h',t:'Not yet placed'});left.forEach(function(c){L.push({k:'li',t:T(c.text)});});}
      out.push({title:'Round 1: Name That Power',lines:L});
    }else if(id==='r2'||id==='r3'){
      var items=id==='r2'?R2:R3,store=id==='r2'?state.r2:state.r3;
      var sc=mcScore(items,store);
      L.push({k:'p',t:'Answered '+sc.answered+' of '+items.length+'. Correct: '+sc.correct+'.'});
      items.forEach(function(it,i){
        var list=id==='r2'?it.opts:R3_OPTS;
        L.push({k:'h',t:(i+1)+'. '+T(it.stem)});
        var ch=store[it.id];
        if(!ch){L.push({k:'li',t:'Not answered'});}
        else{
          L.push({k:'li',t:'Your answer: '+optText(list,ch)+(ch===it.correct?' (correct)':' (not correct)')});
          if(ch!==it.correct)L.push({k:'li',t:'Correct answer: '+optText(list,it.correct)});
          L.push({k:'li',t:'Why: '+T(it.why)});
        }
      });
      if(id==='r3'){
        L.push({k:'h',t:'My own example'});
        L.push({k:'r',t:(state.reflect.r3own||'').trim()||'(no response)'});
      }
      out.push({title:id==='r2'?'Round 2: When Laws Collide':'Round 3: Trace the Rule',lines:L});
    }else if(id==='ref'){
      REFLECT.forEach(function(r,i){
        L.push({k:'h',t:(i+1)+'. '+r.head+': '+r.q});
        L.push({k:'r',t:(state.reflect[r.id]||'').trim()||'(no response)'});
      });
      out.push({title:'Reflection',lines:L});
    }
  });
  return out;
}
function buildText(secs){
  var t='Who Holds the Power? Federal vs. State Government\n';
  secs.forEach(function(s){
    t+='\n== '+s.title+' ==\n';
    s.lines.forEach(function(l){
      if(l.k==='h')t+='\n'+l.t+'\n';
      else if(l.k==='li')t+='  - '+l.t+'\n';
      else t+=l.t+'\n';
    });
  });
  return t;
}
function buildPrintHTML(secs){
  var h='<h1>Who Holds the Power? Federal vs. State Government</h1><p class="nameline">Name: ______________________________ &nbsp; Date: ______________</p>';
  secs.forEach(function(s){
    h+='<h2>'+esc(s.title)+'</h2>';
    var inList=false;
    s.lines.forEach(function(l){
      if(l.k!=='li'&&inList){h+='</ul>';inList=false;}
      if(l.k==='h')h+='<h3>'+esc(l.t)+'</h3>';
      else if(l.k==='p')h+='<p>'+esc(l.t)+'</p>';
      else if(l.k==='r')h+='<div class="resp">'+esc(l.t)+'</div>';
      else{if(!inList){h+='<ul>';inList=true;}h+='<li>'+esc(l.t)+'</li>';}
    });
    if(inList)h+='</ul>';
  });
  return h;
}
function askConfirmReset(msg){
  $('confirmResetMsg').textContent=msg;
  openModal('confirmResetModal');
}
function exportPdf(){
  var ids=selectedSections();
  if(!ids.length){$('exportErr').textContent='Choose at least one section to export.';return;}
  $('printArea').innerHTML=buildPrintHTML(buildSections(ids));
  closeModal('exportModal');
  window.print();
  /* window.print() gives no success signal, so ask instead of guessing */
  setTimeout(function(){askConfirmReset('Did your PDF actually download or save? Check your Downloads folder before answering.');},500);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  return ok;
}
function exportCopy(){
  var ids=selectedSections();
  if(!ids.length){$('exportErr').textContent='Choose at least one section to export.';return;}
  var text=buildText(buildSections(ids));
  function done(){closeModal('exportModal');askConfirmReset('Copied! Paste it into your Google Doc, check that it looks right, then confirm.');}
  function fail(){$('exportErr').textContent='Copy failed. Your work is still saved. Try again or use Save as PDF.';}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){if(fallbackCopy(text))done();else fail();});
  }else{if(fallbackCopy(text))done();else fail();}
}
function resetSimState(){
  state=defaultState();
  optOrder={};selectedCard=null;r1Msg={text:'',kind:''};
  $('printArea').innerHTML='';
  renderAll();
  showTab(0);
}

/* ---------- tier ---------- */
function setTier(t){
  state.tier=t;
  $('tierStd').setAttribute('aria-pressed',t==='standard'?'true':'false');
  $('tierSimple').setAttribute('aria-pressed',t==='simple'?'true':'false');
  save();
  renderAll();
}
function renderAll(){
  renderDirections();renderR1();renderR2();renderR3();renderReflect();updateTabs();
  $('tierStd').setAttribute('aria-pressed',state.tier==='standard'?'true':'false');
  $('tierSimple').setAttribute('aria-pressed',state.tier==='simple'?'true':'false');
  if(!storageOK)$('saveNote').textContent='Auto-save is not available in this view. Use Export before you close the page.';
}

/* ---------- wire up ---------- */
$('tierStd').addEventListener('click',function(){setTier('standard');});
$('tierSimple').addEventListener('click',function(){setTier('simple');});
$('exportPdfBtn').addEventListener('click',exportPdf);
$('exportCopyBtn').addEventListener('click',exportCopy);
$('exportCancelBtn').addEventListener('click',function(){closeModal('exportModal');});
$('confirmResetYesBtn').addEventListener('click',function(){
  closeModal('confirmResetModal');
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  resetSimState();
});
$('confirmResetNoBtn').addEventListener('click',function(){closeModal('confirmResetModal');});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('exportModal').classList.contains('active'))closeModal('exportModal');
    else if($('confirmResetModal').classList.contains('active'))closeModal('confirmResetModal');
  }
});

buildTabs();
renderAll();
showTab(0);
})();
</script>
